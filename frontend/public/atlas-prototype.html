      const ghostTypes = ["Wiki Page", "Entity", "Concept", "Document"];
      const ghostLabels = [
        "Legacy Spec", "RPGLE", "Program Card", "BRD", "Source Index", "DDS", "COBOL", "SME",
        "Interface", "Batch Job", "Field Rule", "Evidence", "Migration", "Flow", "Golden", "Coverage"
      ];
      const ghostNodes = Array.from({ length: 120 }, (_, index) => {
        const angle = index * 2.399;
        const ring = 70 + (index % 9) * 34;
        const wobble = (index % 5) * 14;
        return {
          id: `ghost-${index}`,
          label: ghostLabels[index % ghostLabels.length],
          type: ghostTypes[index % ghostTypes.length],
          x: 690 + Math.cos(angle) * (ring + wobble),
          y: 390 + Math.sin(angle) * (ring * 0.72 + wobble),
          r: 10 + (index % 4) * 4
        };
      });
      const primaryNodes = appData.graph.nodes.map((node) => ({
        ...node,
        x: node.x * 0.9 + 175,
        y: node.y * 0.9 + 95,
        r: Math.max(14, node.r * 0.78)
      }));
      const nodeById = Object.fromEntries(primaryNodes.map((node) => [node.id, node]));
      const ghostEdges = ghostNodes.map((node, index) => {
        const target = ghostNodes[(index * 7 + 11) % ghostNodes.length];
        return `<line x1="${node.x.toFixed(1)}" y1="${node.y.toFixed(1)}" x2="${target.x.toFixed(1)}" y2="${target.y.toFixed(1)}" stroke="var(--line)" stroke-width="0.7" opacity="0.25" marker-end="url(#arrowMuted)" />`;
      }).join("");
      const edges = appData.graph.edges.map(([from, to]) => {
        const a = nodeById[from];
        const b = nodeById[to];
        return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${graphColor[b.type] || "var(--orange)"}" stroke-width="1.6" opacity="0.78" marker-end="url(#arrowStrong)" />`;
      }).join("");
      const ghosts = ghostNodes.map((node) => `
        <g class="graph-node ghost">
          <circle cx="${node.x.toFixed(1)}" cy="${node.y.toFixed(1)}" r="${node.r}" fill="${graphColor[node.type]}" opacity="0.52"></circle>
          <text class="graph-label" x="${node.x.toFixed(1)}" y="${(node.y + node.r + 11).toFixed(1)}" text-anchor="middle">${node.label}</text>
        </g>
      `).join("");
      const nodes = primaryNodes.map((node) => `
        <g class="graph-node" data-node="${node.id}">
          <circle cx="${node.x}" cy="${node.y}" r="${node.r}" fill="${graphColor[node.type]}" opacity="0.88"></circle>
          <circle cx="${node.x}" cy="${node.y}" r="${node.r + 5}" fill="none" stroke="${graphColor[node.type]}" opacity="0.24" stroke-width="7" stroke-dasharray="${node.type === "Concept" ? "3 4" : "0"}"></circle>
          <text class="graph-label" x="${node.x}" y="${node.y + node.r + 18}" text-anchor="middle">${node.label}</text>
        </g>
      `).join("");
      svg.innerHTML = `
        <defs>
          <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 z" fill="var(--line)" opacity="0.4"></path>
          </marker>
          <marker id="arrowStrong" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path>
          </marker>
        </defs>
        <g>${ghostEdges}</g>
        <g>${ghosts}</g>
        <g>${edges}</g>
        <g>${nodes}</g>
      `;
    }

    function showNodeDetail(nodeId) {
      const node = appData.graph.nodes.find((item) => item.id === nodeId);
      const detail = document.querySelector("#nodeDetail");
      if (!node || !detail) return;
      detail.innerHTML = `
        <h3>${node.label}</h3>
        <p><span class="badge" style="color:#fff;background:${graphColor[node.type]}">${node.type}</span></p>
        <p style="color:var(--muted);line-height:1.55;">${node.detail}</p>
      `;
    }

    function bindEvents() {
      document.addEventListener("click", async (event) => {
        const spaceCard = event.target.closest("[data-space]");
        if (spaceCard && spaceCard.dataset.space === "IBM i Modernization") {
          showSpace("wiki");
        }

        const promptChip = event.target.closest("[data-prompt]");
        if (promptChip) {
          const input = document.querySelector("#homeDialogInput");
          if (input) {
            input.value = promptChip.dataset.prompt;
            input.focus();
          }
        }

        const kbItem = event.target.closest(".kb-item");
        if (kbItem && kbItem.dataset.kb === "IBM i Modernization") {
          showSpace("wiki");
        }

        const navButton = event.target.closest("[data-nav]");
        if (navButton) {
          if (navButton.dataset.navKey === "chat") showChat();
          else showHome();
        }

        const chatKb = event.target.closest("[data-chat-kb]");
        if (chatKb) {
          const kbName = chatKb.dataset.chatKb;
          if (uiState.selectedChatSpaces.includes(kbName)) {
            uiState.selectedChatSpaces = uiState.selectedChatSpaces.filter((name) => name !== kbName);
          } else {
            uiState.selectedChatSpaces = [...uiState.selectedChatSpaces, kbName];
          }
          renderChat();
        }

        const openSettingsButton = event.target.closest("[data-open-settings]");
        if (openSettingsButton) {
          showSettings("general");
        }

        const createSpaceButton = event.target.closest("[data-create-space]");
        if (createSpaceButton) {
          showCreateSpace();
        }

        const uploadButton = event.target.closest("[data-upload-kind]");
        if (uploadButton) {
          await openUpload(uploadButton.dataset.uploadKind);
        }

        if (event.target.id === "uploadView") {
          if (uiState.uploadFlowState === "REPORT_OPEN") closeBatchReport();
          else cancelUpload();
        }

        const uploadCancel = event.target.closest("[data-upload-cancel]");
        if (uploadCancel) {
          cancelUpload();
        }

        const uploadCreate = event.target.closest("[data-upload-create]");
        if (uploadCreate) {
          await createBatchFromInventory();
        }

        const viewReport = event.target.closest("[data-view-report]");
        if (viewReport) {
          await openBatchReport();
        }

        const docOpen = event.target.closest("[data-doc-open]");
        if (docOpen) {
          openDocDetail(Number(docOpen.dataset.docOpen));
        }

        if (event.target.id === "docDetailView") {
          closeDocDetail();
        }

        const docDetailClose = event.target.closest("[data-doc-detail-close]");
        if (docDetailClose) {
          closeDocDetail();
        }

        const reportClose = event.target.closest("[data-report-close]");
        if (reportClose) {
          closeBatchReport();
        }

        if (event.target.id === "closeSettings" || event.target.id === "settingsView") {
          closeSettings();
        }

        if (event.target.id === "closeCreateSpace" || event.target.id === "cancelCreateSpace") {
          closeCreateSpace();
        }

        const indexStrategy = event.target.closest("[data-index-strategy]");
        if (indexStrategy) {
          uiState.selectedIndexStrategy = indexStrategy.dataset.indexStrategy;
          renderCreateSpace();
        }

        const knowledgeType = event.target.closest("[data-knowledge-type]");
        if (knowledgeType) {
          uiState.selectedKnowledgeType = knowledgeType.dataset.knowledgeType;
          renderCreateSpace();
        }

        const createStep = event.target.closest("[data-create-step]");
        if (createStep) {
          uiState.createStep = createStep.dataset.createStep;
          renderCreateSpace();
        }

        const settingsPanel = event.target.closest("[data-settings-panel]");
        if (settingsPanel) {
          showSettings(settingsPanel.dataset.settingsPanel);
        }

        const modelMenuToggle = event.target.closest("[data-toggle-model-menu]");
        if (modelMenuToggle) {
          uiState.modelMenuOpen = !uiState.modelMenuOpen;
          renderModelSettings();
          return;
        }

        const addModelType = event.target.closest("[data-add-model-type]");
        if (addModelType) {
          addSettingsModel(addModelType.dataset.addModelType);
          return;
        }

        const modelCategory = event.target.closest("[data-model-category]");
        if (modelCategory) {
          uiState.modelCategory = modelCategory.dataset.modelCategory;
          uiState.modelMenuOpen = false;
          renderModelSettings();
          return;
        }

        const modelCard = event.target.closest("[data-model-id]");
        if (modelCard) {
          openModelEditor(modelCard.dataset.modelId);
          return;
        }

        if (event.target.closest("[data-close-model-editor]")) {
          closeModelEditor();
          return;
        }

        const modelSource = event.target.closest("[data-model-source]");
        if (modelSource) {
          const source = modelSource.dataset.modelSource;
          updateModelEditorDraft({
            source,
            provider: source === "Ollama" ? "Ollama" : uiState.modelEditorDraft.provider === "Ollama" ? "DeepSeek" : uiState.modelEditorDraft.provider,
            baseUrl: source === "Ollama" ? "http://localhost:11434" : uiState.modelEditorDraft.baseUrl
          });
          return;
        }

        const modelKeyStatus = event.target.closest("[data-model-key-status]");
        if (modelKeyStatus) {
          updateModelEditorDraft({
            apiKeyStatus: modelKeyStatus.dataset.modelKeyStatus,
            apiKeyEditing: false
          });
          return;
        }

        if (event.target.closest("[data-start-model-key-replace]")) {
          updateModelEditorDraft({ apiKeyEditing: true });
          return;
        }

        if (event.target.closest("[data-cancel-model-key-replace]")) {
          updateModelEditorDraft({ apiKeyEditing: false });
          return;
        }

        if (event.target.closest("[data-confirm-model-key-replace]")) {
          const apiKeyValue = document.querySelector("#modelEditorApiKey")?.value.trim();
          if (apiKeyValue) {
            updateModelEditorDraft({ apiKeyStatus: "configured", apiKeyEditing: false });
          }
          return;
        }

        if (event.target.closest("[data-toggle-model-multimodal]")) {
          updateModelEditorDraft({ supportsMultimodal: !uiState.modelEditorDraft.supportsMultimodal });
          return;
        }

        if (event.target.closest("[data-save-model-editor]")) {
          saveModelEditor();
          return;
        }

        if (event.target.closest("[data-test-model-connection]")) {
          return;
        }

        if (event.target.id === "backHome") {
          showHome();
        }

        const tab = event.target.closest("[data-tab]");
        if (tab) {
          setTab(tab.dataset.tab);
        }

        const indexItem = event.target.closest("[data-section]");
        if (indexItem) {
          const target = document.getElementById(indexItem.dataset.section);
          document.querySelectorAll(".index-list button").forEach((button) => button.classList.remove("active"));
          document.querySelectorAll(".wiki-section").forEach((section) => section.classList.remove("highlight"));
          indexItem.classList.add("active");
          if (target) {
            target.classList.add("highlight");
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }

        const graphNode = event.target.closest(".graph-node");
        if (graphNode) {
          showNodeDetail(graphNode.dataset.node);
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.id === "settingsLanguageSelect") {
          uiState.lang = event.target.value;
          localStorage.setItem("atlas-lang", uiState.lang);
          renderApp();
          return;
        }

        if (event.target.id === "settingsThemeSelect") {
          uiState.theme = event.target.value;
          localStorage.setItem("atlas-theme", uiState.theme);
          renderApp();
        }
      });

      document.addEventListener("mousemove", (event) => {
        const graphNode = event.target.closest(".graph-node");
        const tooltip = document.querySelector("#graphTooltip");
        if (!tooltip) return;
        if (!graphNode) {
          tooltip.style.display = "none";
          return;
        }
        const node = appData.graph.nodes.find((item) => item.id === graphNode.dataset.node);
        tooltip.innerHTML = `<strong>${node.label}</strong><br>${node.type}<br>${node.detail}`;
        tooltip.style.display = "block";
        const canvasRect = document.querySelector(".graph-canvas").getBoundingClientRect();
        tooltip.style.left = `${event.clientX - canvasRect.left + 14}px`;
        tooltip.style.top = `${event.clientY - canvasRect.top + 14}px`;
      });

      document.addEventListener("keydown", (event) => {
        const docOpen = event.target.closest ? event.target.closest("[data-doc-open]") : null;
        if ((event.key === "Enter" || event.key === " ") && docOpen) {
          event.preventDefault();
          openDocDetail(Number(docOpen.dataset.docOpen));
          return;
        }
        if (event.key === "Escape" && docDetailView.classList.contains("active")) {
          closeDocDetail();
          return;
        }
        if (event.key === "Escape" && (uiState.uploadFlowState === "INVENTORY_READY" || uiState.uploadFlowState === "INVENTORY_EMPTY")) {
          cancelUpload();
          return;
        }
        if (event.key === "Escape" && uiState.uploadFlowState === "REPORT_OPEN") {
          closeBatchReport();
          return;
        }
        if (event.key === "Escape" && uiState.settingsOpen) {
          closeSettings();
        }
      });
    }

    renderApp();
    bindEvents();
  </script>
</body>
</html>
