<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Knowledge Hub</title>
  <style>
    :root {
      --bg: #f7f8f9;
      --panel: #ffffff;
      --panel-soft: #f4f6f7;
      --panel-raised: #ffffff;
      --ink: #18211f;
      --muted: #66726f;
      --line: #e1e5e4;
      --primary: #3f6f8f;
      --primary-dark: #2f536b;
      --primary-soft: #edf3f6;
      --blue: #4b6f9f;
      --orange: #a66f28;
      --red: #b94a48;
      --gray: #68757c;
      --green: #5f8272;
      --shadow: 0 1px 2px rgba(24, 33, 31, 0.05), 0 10px 24px rgba(24, 33, 31, 0.04);
      --radius: 8px;
    }

    [data-theme="night"] {
      --bg: #0f1115;
      --panel: #171a20;
      --panel-soft: #20242b;
      --panel-raised: #1b1f26;
      --ink: #e6e8ec;
      --muted: #9aa3af;
      --line: #2b3038;
      --primary: #6f93a6;
      --primary-dark: #a9c1cf;
      --primary-soft: #1d2830;
      --blue: #83a2c7;
      --orange: #c49a68;
      --red: #d0827c;
      --gray: #9aa3af;
      --green: #6fa586;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.24), 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--bg);
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
      min-width: 0;
    }

    .sidebar {
      position: sticky;
      top: 0;
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      color: var(--ink);
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 17px;
      font-weight: 800;
      min-width: 0;
    }

    .brand-mark {
      flex: 0 0 auto;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: #2f536b;
    }

    .side-nav {
      display: grid;
      gap: 5px;
      min-height: 0;
      overflow: auto;
    }

    .side-nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      color: var(--ink);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius);
    }

    .side-nav button.active,
    .side-nav button:hover {
      color: var(--primary-dark);
      background: var(--primary-soft);
      font-weight: 800;
    }

    .side-label {
      margin: 14px 8px 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .side-search {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 10px;
      margin-bottom: 10px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .side-recent {
      display: grid;
      gap: 4px;
      padding: 0 8px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      list-style: none;
    }

    .side-divider {
      height: 1px;
      margin: 10px 0;
      background: var(--line);
    }

    .side-workspace {
      padding: 10px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .workspace-title {
      margin: 0 0 4px;
      font-weight: 800;
    }

    .workspace-role {
      color: var(--muted);
      font-size: 12px;
    }

    .side-footer {
      margin-top: auto;
      padding-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      border-top: 1px solid var(--line);
    }

    .utility-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .utility-btn {
      min-height: 32px;
      padding: 6px 8px;
      color: var(--ink);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .utility-btn:hover {
      background: var(--primary-soft);
    }

    .main {
      width: 100%;
      min-width: 0;
      padding: 26px 28px 34px;
    }

    .page-head,
    .space-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .title-block h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }

    .title-block p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 13px;
      color: #fff;
      white-space: nowrap;
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(24, 33, 31, 0.08);
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn.secondary {
      color: var(--primary-dark);
      background: var(--panel);
      border-color: var(--line);
      box-shadow: none;
    }

    .btn:disabled,
    .btn:disabled:hover {
      cursor: not-allowed;
      opacity: 0.55;
      color: var(--muted);
      background: var(--panel-soft);
      border-color: var(--line);
    }

    .dialog-hero {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 430px;
      padding: 34px 28px 46px;
      margin-bottom: 22px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: none;
    }

    .dialog-center {
      width: min(820px, 100%);
      text-align: center;
    }

    .dialog-center h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
    }

    .dialog-center p {
      margin: 12px 0 0;
      color: var(--muted);
    }

    .prompt-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 22px auto 24px;
    }

    .prompt-chip {
      padding: 9px 14px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: none;
    }

    .dialog-box {
      position: relative;
      z-index: 2;
      display: grid;
      min-height: 158px;
      padding: 14px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(24, 33, 31, 0.05);
    }

    .dialog-input {
      width: 100%;
      min-height: 70px;
      padding: 3px 2px;
      color: var(--ink);
      resize: none;
      background: transparent;
      border: 0;
      outline: none;
    }

    .dialog-input::placeholder {
      color: #8c9896;
    }

    .dialog-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .tool-left,
    .tool-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mini-btn,
    .icon-btn,
    .model-select {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 6px 10px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .icon-btn {
      width: 30px;
      padding: 0;
      border-color: transparent;
      color: #778481;
      background: transparent;
      font-size: 17px;
    }

    .send-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
    }

    .knowledge-popover {
      position: absolute;
      z-index: 3;
      bottom: 96px;
      left: 50%;
      width: 304px;
      padding: 12px;
      text-align: left;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(24, 33, 31, 0.12);
      transform: translateX(-150%);
    }

    .knowledge-popover h3 {
      margin: 2px 2px 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .kb-list {
      display: grid;
      gap: 4px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .kb-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 8px;
      color: var(--ink);
      border-radius: var(--radius);
    }

    .kb-item.selected {
      color: var(--primary-dark);
      background: var(--primary-soft);
    }

    .folder-icon {
      color: currentColor;
      font-size: 15px;
    }

    .kb-count {
      color: var(--muted);
      font-size: 12px;
    }

    .selected-kb-card {
      position: absolute;
      z-index: 4;
      bottom: 116px;
      left: 50%;
      width: 260px;
      padding: 14px 15px;
      text-align: left;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(24, 33, 31, 0.11);
      transform: translateX(6%);
    }

    .selected-kb-card strong {
      display: inline-block;
      margin-right: 8px;
      font-size: 15px;
    }

    .selected-kb-card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .section-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin: 8px 0 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .section-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .settings-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 16px;
    }

    .settings-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(14, 23, 18, 0.56);
    }

    .settings-modal.active {
      display: grid;
      place-items: center;
    }

    .settings-window {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      width: min(1080px, calc(100vw - 48px));
      height: min(760px, calc(100vh - 48px));
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
    }

    .settings-rail {
      padding: 18px 10px;
      background: var(--panel-soft);
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .settings-rail h2 {
      margin: 0 8px 14px;
      font-size: 18px;
    }

    .settings-content {
      position: relative;
      min-width: 0;
      padding: 26px 32px 34px;
      overflow: auto;
    }

    .settings-close {
      position: absolute;
      top: 20px;
      right: 22px;
      width: 34px;
      height: 34px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius);
      font-size: 26px;
      line-height: 1;
    }

    .settings-close:hover {
      color: var(--ink);
      background: var(--panel-soft);
    }

    .upload-window {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(1040px, calc(100vw - 48px));
      max-height: min(760px, calc(100vh - 48px));
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
    }

    .upload-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 26px 16px;
      border-bottom: 1px solid var(--line);
    }

    .upload-head h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .upload-head p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .upload-body {
      display: grid;
      gap: 16px;
      min-height: 0;
      padding: 18px 26px;
      overflow: auto;
    }

    .upload-section h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .inventory-list,
    .report-list {
      display: grid;
      gap: 8px;
    }

    .inventory-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 78px 82px auto auto;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .inventory-row.unsupported {
      background: color-mix(in srgb, var(--panel-soft) 86%, #944844);
    }

    .inventory-meta,
    .help-line,
    .empty-note,
    .tree-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .upload-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 26px 20px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .report-entry {
      display: grid;
      gap: 7px;
      padding: 11px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .report-entry-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .report-entry-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .create-space-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      background: var(--panel);
    }

    .create-space-modal.active {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }

    .create-rail {
      display: flex;
      flex-direction: column;
      background: var(--panel-soft);
      border-right: 1px solid var(--line);
    }

    .create-rail h1 {
      margin: 0;
      padding: 26px 22px 32px;
      font-size: 24px;
      border-bottom: 1px solid var(--line);
    }

    .create-steps {
      display: grid;
      gap: 8px;
      padding: 18px 12px;
    }

    .create-step {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 12px;
      color: var(--muted);
      border: 0;
      border-radius: 10px;
      background: transparent;
      font-size: 15px;
      font-weight: 700;
      text-align: left;
    }

    .create-step:hover {
      color: var(--primary-dark);
      background: var(--panel);
    }

    .create-step.active {
      color: var(--primary-dark);
      background: var(--primary-soft);
    }

    .create-step-icon {
      display: inline-grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 2px solid currentColor;
      border-radius: 999px;
      font-size: 14px;
    }

    .create-main {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-width: 0;
      max-height: 100vh;
      background: var(--panel);
    }

    .create-content {
      min-width: 0;
      padding: 30px 36px 34px;
      overflow: auto;
    }

    .create-close {
      position: absolute;
      top: 18px;
      right: 22px;
      width: 38px;
      height: 38px;
      color: #666;
      background: #f0f0f0;
      border: 0;
      border-radius: var(--radius);
      font-size: 28px;
      line-height: 1;
    }

    .create-content h2 {
      margin: 0;
      font-size: 28px;
    }

    .create-subtitle {
      margin: 10px 0 30px;
      color: var(--muted);
      font-size: 14px;
    }

    .create-form {
      display: grid;
      gap: 24px;
      max-width: 1120px;
    }

    .create-label {
      display: block;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 800;
    }

    .required {
      color: #ef4f5f;
    }

    .type-toggle {
      display: inline-flex;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .type-toggle button {
      min-width: 92px;
      min-height: 42px;
      color: var(--ink);
      border: 0;
      background: var(--panel);
      font-size: 15px;
      font-weight: 800;
    }

    .type-toggle button.active {
      color: #fff;
      background: var(--primary);
    }

    .create-help {
      display: block;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .index-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .index-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 118px;
      padding: 18px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .index-option.active {
      background: var(--primary-soft);
      border-color: color-mix(in srgb, var(--primary) 45%, var(--line));
    }

    .fake-checkbox {
      display: inline-grid;
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      place-items: center;
      color: #fff;
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 5px;
      font-size: 16px;
      font-weight: 900;
    }

    .index-option:not(.active) .fake-checkbox {
      color: transparent;
      background: var(--panel);
      border-color: var(--line);
    }

    .option-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
    }

    .new-pill {
      padding: 2px 8px;
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-radius: 5px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .create-input,
    .create-textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: var(--panel);
      font-size: 15px;
      outline: none;
    }

    .create-input {
      min-height: 42px;
      padding: 0 12px;
    }

    .create-textarea {
      min-height: 128px;
      padding: 12px;
    }

    .create-count {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .create-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 18px 36px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .create-actions button {
      min-width: 96px;
      min-height: 38px;
      padding: 0 18px;
      border-radius: var(--radius);
      font-size: 15px;
    }

    .create-actions .primary {
      color: #fff;
      background: var(--primary);
      border: 1px solid var(--primary);
    }

    .settings-subnav {
      display: grid;
      gap: 5px;
    }

    .settings-group-label {
      margin: 14px 8px 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .settings-subnav button {
      width: 100%;
      padding: 9px 10px;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius);
    }

    .settings-subnav button.active {
      color: var(--primary-dark);
      background: var(--primary-soft);
      font-weight: 800;
    }

    .settings-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }

    .settings-tab {
      padding: 8px 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .settings-tab.active {
      color: var(--primary-dark);
      background: var(--primary-soft);
      font-weight: 800;
    }

    .model-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .model-info-panel {
      padding: 14px 16px;
      margin: 8px 0 34px;
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .model-info-panel strong {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .model-info-panel a {
      display: inline-flex;
      gap: 6px;
      margin-top: 10px;
      color: var(--primary-dark);
      font-weight: 800;
      text-decoration: none;
    }

    .model-add-control {
      position: relative;
      display: inline-flex;
      justify-content: flex-end;
    }

    .model-add-menu {
      position: absolute;
      z-index: 4;
      top: calc(100% + 10px);
      right: 0;
      display: grid;
      width: 160px;
      padding: 8px 0;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 16px 30px rgba(24, 33, 31, 0.16);
    }

    .model-add-menu button {
      min-height: 40px;
      padding: 0 18px;
      color: var(--ink);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 0;
      font-size: 14px;
    }

    .model-add-menu button:hover {
      color: var(--primary-dark);
      background: var(--primary-soft);
    }

    .model-config-panel {
      display: grid;
      gap: 18px;
      margin: 0 0 32px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .model-config-header {
      display: grid;
      gap: 8px;
    }

    .model-config-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .model-config-header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .model-config-badge {
      width: fit-content;
      padding: 4px 10px;
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .model-config-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.9fr);
      gap: 16px;
      align-items: stretch;
    }

    .model-config-list {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 10px 16px;
      margin: 0;
      padding: 16px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .model-config-list dt {
      color: var(--muted);
      font-weight: 800;
    }

    .model-config-list dd {
      margin: 0;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text);
    }

    .model-command {
      margin: 0;
      padding: 16px;
      overflow: auto;
      color: var(--text);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 12px;
      line-height: 1.55;
    }

    .model-safety-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    .model-list-tabs {
      display: flex;
      gap: 28px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .model-list-tab {
      min-height: 42px;
      padding: 0 0 12px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      font-size: 15px;
    }

    .model-list-tab.active {
      color: var(--primary-dark);
      border-color: var(--primary);
      font-weight: 800;
    }

    .model-list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .model-list-card {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 16px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: none;
    }

    .model-list-card:hover {
      border-color: color-mix(in srgb, var(--primary) 32%, var(--line));
    }

    .model-icon {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-radius: 8px;
      font-size: 18px;
      font-weight: 800;
    }

    .model-list-card h3 {
      margin: 0 0 6px;
      font-size: 15px;
    }

    .model-list-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .add-model-btn {
      color: var(--primary-dark);
      background: var(--panel);
      border-color: var(--primary);
    }

    .model-editor-scrim {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0, 0, 0, 0.56);
    }

    .model-editor-drawer {
      position: fixed;
      z-index: 31;
      top: 0;
      right: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(548px, 100vw);
      height: 100vh;
      color: var(--ink);
      background: var(--panel);
      box-shadow: -18px 0 42px rgba(0, 0, 0, 0.18);
    }

    .model-editor-head {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 12px;
      padding: 20px 18px;
      border-bottom: 1px solid var(--line);
    }

    .model-editor-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-radius: 8px;
      font-size: 18px;
      font-weight: 800;
    }

    .model-editor-head h2 {
      margin: 0 0 4px;
      font-size: 16px;
    }

    .model-editor-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .model-editor-body {
      display: grid;
      gap: 18px;
      align-content: start;
      padding: 18px;
      overflow: auto;
    }

    .model-editor-section {
      display: grid;
      gap: 12px;
      padding-top: 2px;
      border-top: 1px solid var(--line);
    }

    .model-editor-section:first-child {
      border-top: 0;
    }

    .model-editor-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 14px;
    }

    .model-editor-title::before {
      width: 3px;
      height: 16px;
      content: "";
      background: var(--primary);
      border-radius: 99px;
    }

    .model-source-toggle,
    .model-key-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-source-toggle {
      padding: 4px;
      width: fit-content;
      background: var(--panel-soft);
      border-radius: 8px;
    }

    .model-source-toggle button {
      min-height: 32px;
      padding: 0 14px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
    }

    .model-source-toggle button.active {
      color: var(--primary-dark);
      background: var(--panel);
      border-color: var(--primary);
      font-weight: 800;
    }

    .model-editor-field {
      display: grid;
      gap: 7px;
    }

    .model-editor-field label {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .model-editor-field.required label::before {
      margin-right: 3px;
      color: var(--red);
      content: "*";
    }

    .model-editor-field input,
    .model-editor-field select {
      width: 100%;
      min-height: 32px;
      padding: 7px 10px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 5px;
      outline: none;
    }

    .model-editor-field input:focus,
    .model-editor-field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .field-help {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .model-key-row {
      justify-content: space-between;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    .model-key-editor {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .model-key-editor input {
      min-height: 32px;
      padding: 7px 10px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 5px;
      outline: none;
    }

    .model-key-editor input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .model-key-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ink);
      font-size: 13px;
    }

    .model-key-status::before {
      display: grid;
      width: 16px;
      height: 16px;
      place-items: center;
      color: white;
      content: "✓";
      background: var(--primary-dark);
      border-radius: 50%;
      font-size: 11px;
    }

    .model-key-status.empty::before {
      content: "";
      background: var(--line);
    }

    .text-action {
      color: var(--primary-dark);
      background: transparent;
      border: 0;
      border-radius: 4px;
    }

    .text-action.danger {
      color: var(--red);
    }

    .model-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .switch-track {
      position: relative;
      width: 34px;
      height: 20px;
      padding: 0;
      background: #d1d5db;
      border: 0;
      border-radius: 99px;
    }

    .switch-track::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      content: "";
      background: white;
      border-radius: 50%;
      transition: transform 0.16s ease;
    }

    .switch-track.active {
      background: var(--primary);
    }

    .switch-track.active::after {
      transform: translateX(14px);
    }

    .model-editor-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
    }

    .model-editor-foot .right-actions {
      display: flex;
      gap: 10px;
    }

    .model-card {
      display: grid;
      gap: 10px;
      min-height: 124px;
      padding: 14px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .model-card.active,
    .model-card:hover {
      border-color: color-mix(in srgb, var(--primary) 32%, var(--line));
    }

    .model-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .model-head strong {
      display: block;
      margin-bottom: 4px;
    }

    .model-provider {
      color: var(--muted);
      font-size: 12px;
    }

    .model-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .config-panel {
      position: sticky;
      top: 24px;
      align-self: start;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .config-section {
      padding-top: 16px;
      margin-top: 16px;
      border-top: 1px solid var(--line);
    }

    .config-section h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 15px;
    }

    .config-section h3::before {
      width: 3px;
      height: 16px;
      content: "";
      background: var(--primary);
      border-radius: 999px;
    }

    .field-grid {
      display: grid;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .field-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .secret-row,
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 36px;
      padding: 8px 10px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .toggle-pill {
      width: 34px;
      height: 20px;
      padding: 3px;
      background: #d9dfdd;
      border-radius: 999px;
    }

    .toggle-pill.on {
      background: #c6d8e0;
    }

    .toggle-pill::after {
      display: block;
      width: 14px;
      height: 14px;
      content: "";
      background: #fff;
      border-radius: 50%;
    }

    .toggle-pill.on::after {
      margin-left: 14px;
      background: var(--primary);
    }

    .member-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0;
    }

    .empty-invite {
      padding: 14px;
      margin-top: 10px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0 10px;
    }

    .table-toolbar input {
      width: min(300px, 100%);
      min-height: 36px;
      padding: 8px 10px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .member-table {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .member-row {
      display: grid;
      grid-template-columns: minmax(210px, 1.5fr) 150px 160px 120px;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
    }

    .member-row:last-child {
      border-bottom: 0;
    }

    .member-row.header {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      background: var(--panel-soft);
    }

    .member-name strong {
      display: block;
      margin-bottom: 4px;
    }

    .member-name span {
      color: var(--muted);
      font-size: 12px;
    }

    .role-select {
      min-height: 32px;
      padding: 6px 8px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .registration-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
    }

    .engine-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .engine-card {
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .engine-card.default {
      border-color: color-mix(in srgb, var(--primary) 32%, var(--line));
    }

    .engine-card h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .library-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 20px;
      color: var(--muted);
      font-weight: 700;
    }

    .library-toolbar .owner-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 12px;
      background: transparent;
      border: 0;
      color: var(--muted);
      font-weight: 800;
    }

    .library-toolbar .count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 24px;
      padding: 0 8px;
      color: var(--muted);
      background: var(--panel-soft);
      border-radius: 999px;
    }

    .library-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .library-card {
      position: relative;
      display: grid;
      min-height: 200px;
      padding: 22px;
      overflow: hidden;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .library-card::after {
      position: absolute;
      top: -68px;
      right: -58px;
      width: 150px;
      height: 150px;
      content: "";
      background: var(--primary-soft);
      opacity: 0.55;
      border-radius: 50%;
    }

    .library-card:hover {
      border-color: rgba(63, 111, 143, 0.32);
      transform: translateY(-1px);
    }

    .library-card h2 {
      margin: 0 0 14px;
      font-size: 19px;
      line-height: 1.3;
    }

    .library-card p {
      display: -webkit-box;
      min-height: 52px;
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      line-height: 1.48;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .library-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 13px;
      margin-top: auto;
      border-top: 1px solid var(--line);
    }

    .library-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .library-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 30px;
      padding: 5px 9px;
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-radius: 7px;
      font-size: 13px;
      font-weight: 800;
    }

    .owner-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      padding: 4px 9px;
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .card,
    .panel,
    .metric,
    .wiki-main,
    .wiki-rail,
    .graph-canvas,
    .review-pane,
    .chat-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card {
      display: grid;
      min-height: 218px;
      padding: 18px;
      text-align: left;
      border-color: var(--line);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--primary) 32%, var(--line));
      box-shadow: 0 6px 18px rgba(24, 33, 31, 0.08);
    }

    .card h2,
    .panel h2,
    .panel h3,
    .wiki-main h2,
    .wiki-rail h3,
    .review-pane h3,
    .chat-panel h3 {
      margin: 0;
      line-height: 1.25;
    }

    .card h2 {
      font-size: 18px;
    }

    .card p {
      margin: 10px 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: auto;
    }

    .stat {
      padding: 8px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .stat strong {
      display: block;
      font-size: 17px;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      border-radius: 999px;
    }

    .badge.healthy,
    .badge.approved {
      color: #3b684c;
      background: #eef5f1;
    }

    .badge.review,
    .badge.ocr {
      color: #8b6429;
      background: #f7f1e8;
    }

    .badge.parsing,
    .badge.medium {
      color: #3f5f84;
      background: #edf2f7;
    }

    .badge.failed,
    .badge.needfix {
      color: #944844;
      background: #f7eeee;
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .space-panel {
      padding: 18px;
      margin-bottom: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .space-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 2px;
      margin-bottom: 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      padding: 12px 14px;
      color: var(--muted);
      white-space: nowrap;
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: var(--primary-dark);
      font-weight: 800;
      border-color: var(--primary);
    }

    .tab-view {
      display: none;
    }

    .tab-view.active,
    .view.active {
      display: block;
    }

    .view {
      display: none;
    }

    .split,
    .review-grid,
    .ask-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 16px;
    }

    .doc-grid {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 16px;
    }

    .doc-manager {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 16px;
    }

    .doc-category {
      padding: 15px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .doc-category-head,
    .doc-toolbar,
    .doc-filter-row,
    .doc-view-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .doc-category-head {
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .doc-category-head h2 {
      margin: 0;
      font-size: 17px;
    }

    .doc-category-empty {
      padding: 28px 0;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .doc-main {
      min-width: 0;
    }

    .doc-toolbar {
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .doc-toolbar .search {
      flex: 1 1 320px;
      max-width: 520px;
      margin: 0;
      background: var(--panel-soft);
    }

    .doc-filter-row {
      flex: 1 1 520px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .doc-filter {
      min-height: 38px;
      min-width: 150px;
      padding: 0 12px;
      color: var(--ink);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .doc-date-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .doc-date-row input {
      width: 140px;
      min-height: 36px;
      padding: 0 11px;
      color: var(--ink);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .doc-view-tools {
      padding: 4px;
      background: var(--panel-soft);
      border-radius: var(--radius);
    }

    .doc-view-tools button {
      min-width: 34px;
      min-height: 34px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: calc(var(--radius) - 2px);
      font-size: 18px;
    }

    .doc-view-tools button.active {
      color: var(--primary-dark);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .doc-table {
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .doc-row {
      display: grid;
      grid-template-columns: 44px minmax(320px, 1.8fr) minmax(120px, 0.8fr) minmax(110px, 0.6fr) 90px 110px 150px;
      gap: 12px;
      align-items: center;
      min-width: 1080px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .doc-row.header {
      color: var(--muted);
      background: var(--panel-soft);
      font-weight: 800;
    }

    .doc-row:last-child {
      border-bottom: 0;
    }

    .doc-row:not(.header) {
      cursor: pointer;
    }

    .doc-row:not(.header):hover {
      background: var(--panel-soft);
    }

    .doc-row.selected {
      background: color-mix(in srgb, var(--primary-soft) 58%, var(--panel));
    }

    .doc-check {
      width: 18px;
      height: 18px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
    }

    .doc-check.checked {
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
      font-size: 13px;
      font-weight: 900;
    }

    .doc-failure-note {
      padding: 10px 12px;
      margin-top: 10px;
      color: #944844;
      background: #fff1f0;
      border: 1px solid #ffd2cf;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.5;
    }

    .doc-bulk-bar {
      position: sticky;
      bottom: 20px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(680px, calc(100% - 80px));
      padding: 12px 14px;
      margin: 18px auto 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .doc-danger {
      color: #c83b3b;
      background: #fff7f7;
      border-color: #ffc9c9;
    }

    .doc-file {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .doc-file-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--muted);
      background: var(--panel-soft);
      border-radius: var(--radius);
      font-size: 20px;
    }

    .doc-file strong,
    .doc-file span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .doc-file span,
    .doc-muted {
      color: var(--muted);
      font-size: 13px;
    }

    .doc-detail-modal {
      position: fixed;
      inset: 0;
      z-index: 36;
      display: none;
      justify-content: flex-end;
      background: rgba(14, 18, 16, 0.58);
    }

    .doc-detail-modal.active {
      display: flex;
    }

    .doc-detail-drawer {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(860px, 58vw);
      min-width: 680px;
      height: 100%;
      overflow: hidden;
      background: var(--panel);
      border-left: 1px solid var(--line);
      box-shadow: -14px 0 42px rgba(0, 0, 0, 0.16);
    }

    .doc-detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 66px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .doc-detail-head h2 {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: 20px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .doc-detail-actions {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
    }

    .doc-detail-actions button {
      min-width: 34px;
      min-height: 34px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-radius: var(--radius);
      font-size: 18px;
    }

    .doc-detail-actions button:hover {
      background: var(--panel-soft);
    }

    .doc-detail-body {
      min-height: 0;
      padding: 24px 22px 34px;
      overflow: auto;
    }

    .doc-detail-section {
      margin-bottom: 24px;
    }

    .doc-detail-section h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .doc-summary-box,
    .doc-preview-box,
    .doc-error-box {
      padding: 18px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .doc-error-box {
      color: #944844;
      background: #fff7f7;
      border-color: #ffc9c9;
      line-height: 1.6;
    }

    .doc-summary-box {
      color: var(--ink);
      line-height: 1.55;
    }

    .doc-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .doc-section-head h3 {
      margin: 0;
    }

    .doc-upload-time {
      color: var(--muted);
      font-size: 14px;
    }

    .doc-preview-box {
      position: relative;
      min-height: 520px;
      padding: 36px 32px;
      overflow: auto;
      background: var(--panel);
    }

    .doc-preview-box pre {
      margin: 0;
      color: var(--ink);
      font: inherit;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .doc-expand-btn {
      position: absolute;
      top: 14px;
      right: 14px;
    }

    .panel {
      padding: 16px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .metric {
      padding: 12px;
      box-shadow: none;
    }

    .metric strong {
      display: block;
      font-size: 22px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .progress-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .progress {
      height: 9px;
      overflow: hidden;
      background: #e8eceb;
      border-radius: 999px;
    }

    .progress span {
      display: block;
      height: 100%;
      background: #6f95aa;
    }

    .file-tree {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .file-folder {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .file-row,
    .queue-row,
    .concept-row,
    .source-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 11px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .file-path,
    .queue-row span:first-child {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 13px;
    }

    .file-depth-1 {
      margin-left: 12px;
    }

    .file-depth-2 {
      margin-left: 24px;
    }

    .file-depth-3 {
      margin-left: 36px;
    }

    .wiki-layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 16px;
    }

    .wiki-rail {
      padding: 15px;
      box-shadow: none;
    }

    .search {
      width: 100%;
      height: 38px;
      padding: 0 11px;
      margin: 12px 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .search:focus,
    textarea:focus,
    .ask-input:focus {
      border-color: color-mix(in srgb, var(--primary) 42%, var(--line));
      box-shadow: 0 0 0 3px rgba(63, 111, 143, 0.08);
    }

    .index-list,
    .recent-list,
    .related-list {
      display: grid;
      gap: 8px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .index-list button {
      width: 100%;
      padding: 9px 10px;
      color: var(--ink);
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .index-list button:hover,
    .index-list button.active {
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-color: color-mix(in srgb, var(--primary) 32%, var(--line));
    }

    .recent-list li,
    .related-list li {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .wiki-main {
      padding: 20px 24px;
      box-shadow: none;
    }

    .wiki-main header {
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .wiki-main h2 {
      font-size: 24px;
    }

    .wiki-section {
      padding: 12px 0;
      border-bottom: 1px solid #edf2ee;
      scroll-margin-top: 24px;
    }

    .wiki-section.highlight {
      padding-right: 12px;
      padding-left: 12px;
      margin-right: -12px;
      margin-left: -12px;
      background: var(--primary-soft);
      border-radius: var(--radius);
    }

    .wiki-section h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .wiki-section p,
    .wiki-section li {
      color: var(--ink);
      line-height: 1.68;
    }

    .concept {
      color: var(--primary-dark);
      font-weight: 800;
      text-decoration: underline;
      text-decoration-color: rgba(63, 111, 143, 0.28);
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .trace {
      padding: 10px 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      background: var(--panel-soft);
      border-left: 3px solid #b7c8d0;
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .metadata-list {
      display: grid;
      gap: 11px;
      margin-top: 14px;
    }

    .metadata-list div {
      padding-bottom: 10px;
      border-bottom: 1px solid #edf2ee;
    }

    .metadata-list strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .graph-layout {
      position: relative;
      min-height: 720px;
    }

    .graph-canvas {
      position: relative;
      min-height: 720px;
      overflow: hidden;
      background: var(--panel);
      border: 0;
      box-shadow: none;
    }

    .graph-svg {
      display: block;
      width: 100%;
      min-width: 980px;
      height: 720px;
    }

    .graph-search {
      position: absolute;
      top: 22px;
      left: 22px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(420px, calc(100% - 44px));
      padding: 0 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .graph-search input {
      width: 100%;
      height: 42px;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: none;
    }

    .graph-search span {
      color: var(--muted);
      font-size: 20px;
    }

    .graph-floating-panel {
      position: absolute;
      top: 22px;
      right: 22px;
      z-index: 2;
      width: 218px;
      padding: 16px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .graph-floating-panel .legend-list {
      margin-top: 0;
    }

    .graph-control-list {
      display: grid;
      gap: 10px;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 1px solid var(--line);
    }

    .graph-control-list button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 7px 4px;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
    }

    .graph-overview {
      padding-top: 14px;
      margin-top: 14px;
      color: var(--muted);
      border-top: 1px dashed var(--line);
      line-height: 1.5;
    }

    .graph-overview strong {
      display: block;
      color: var(--ink);
      font-size: 18px;
    }

    .graph-node {
      cursor: pointer;
    }

    .graph-node.ghost {
      cursor: default;
      opacity: 0.28;
    }

    .graph-node.ghost .graph-label {
      font-size: 10px;
      font-weight: 600;
      opacity: 0.55;
    }

    .graph-label {
      pointer-events: none;
      font-size: 12px;
      font-weight: 700;
      fill: #1f2d25;
    }

    .graph-tooltip {
      position: absolute;
      z-index: 3;
      display: none;
      max-width: 260px;
      padding: 9px 11px;
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      background: rgba(18, 22, 27, 0.95);
      border-radius: var(--radius);
      pointer-events: none;
      box-shadow: var(--shadow);
    }

    .legend-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 9px 10px;
      background: transparent;
      border: 0;
      border-radius: var(--radius);
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 7px;
      border-radius: 50%;
      vertical-align: -1px;
    }

    .dot.blue { background: var(--blue); }
    .dot.green { background: var(--green); }
    .dot.orange { background: var(--orange); }
    .dot.gray { background: var(--gray); }
    .dot.red { background: var(--red); }

    .review-grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .review-pane {
      min-height: 390px;
      padding: 16px;
      box-shadow: none;
    }

    .pdf-preview {
      display: grid;
      place-items: center;
      min-height: 270px;
      margin-top: 14px;
      color: var(--muted);
      text-align: center;
      background:
        linear-gradient(90deg, rgba(63, 111, 143, 0.06) 1px, transparent 1px),
        linear-gradient(rgba(63, 111, 143, 0.06) 1px, transparent 1px),
        var(--panel-soft);
      background-size: 26px 26px;
      border: 1px dashed #cfd8dc;
      border-radius: var(--radius);
    }

    .markdown-preview {
      min-height: 250px;
      padding: 14px;
      margin-top: 12px;
      color: var(--ink);
      line-height: 1.62;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    textarea {
      width: 100%;
      min-height: 82px;
      padding: 10px;
      margin-top: 12px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .queue {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .ask-grid {
      grid-template-columns: minmax(0, 1fr) 320px;
    }

    .chat-panel {
      padding: 16px;
      box-shadow: none;
    }

    .message {
      max-width: 86%;
      padding: 12px 13px;
      margin-bottom: 12px;
      line-height: 1.55;
      border-radius: var(--radius);
    }

    .message.user {
      margin-left: auto;
      color: #fff;
      background: var(--primary);
    }

    .message.answer {
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .references {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 12px 0 0;
      list-style: none;
    }

    .references li {
      padding: 9px 10px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    [data-theme="night"] .sidebar {
      background: #12151b;
    }

    [data-theme="night"] .card:hover {
      border-color: #3a4652;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
    }

    [data-theme="night"] .prompt-chip,
    [data-theme="night"] .mini-btn,
    [data-theme="night"] .model-select,
    [data-theme="night"] .index-list button,
    [data-theme="night"] .references li {
      color: var(--ink);
    }

    [data-theme="night"] .kb-item,
    [data-theme="night"] .file-path,
    [data-theme="night"] .wiki-section p,
    [data-theme="night"] .wiki-section li,
    [data-theme="night"] .markdown-preview,
    [data-theme="night"] .references li {
      color: var(--ink);
    }

    [data-theme="night"] .trace {
      color: #c8d0d8;
      background: #20242b;
    }

    [data-theme="night"] .graph-label {
      fill: #d9dee5;
    }

    [data-theme="night"] .badge.healthy,
    [data-theme="night"] .badge.approved {
      color: #a8d6ba;
      background: rgba(111, 165, 134, 0.16);
    }

    [data-theme="night"] .badge.review,
    [data-theme="night"] .badge.ocr {
      color: #e1bd82;
      background: rgba(196, 154, 104, 0.15);
    }

    [data-theme="night"] .badge.parsing,
    [data-theme="night"] .badge.medium {
      color: #b5c9e3;
      background: rgba(131, 162, 199, 0.15);
    }

    [data-theme="night"] .badge.failed,
    [data-theme="night"] .badge.needfix {
      color: #e5aaa6;
      background: rgba(208, 130, 124, 0.14);
    }

    [data-theme="night"] .progress {
      background: #272c34;
    }

    [data-theme="night"] .progress span {
      background: #7898aa;
    }

    [data-theme="night"] .wiki-section,
    [data-theme="night"] .metadata-list div {
      border-color: var(--line);
    }

    [data-theme="night"] .pdf-preview {
      background:
        linear-gradient(90deg, rgba(154, 163, 175, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(154, 163, 175, 0.08) 1px, transparent 1px),
        var(--panel-soft);
      border-color: #3a414c;
    }

    .ask-input-row {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .ask-input {

    }

      .review-grid,
      .ask-input-row {

        grid-template-columns: 1fr;
      }

      .cards,
      .library-cards,
      .model-grid,
      .model-list-grid,
      .engine-grid,
      .metric-grid,
      .stats {
        grid-template-columns: 1fr;
      }

      .dialog-hero {
        min-height: 520px;
        padding: 26px 16px 34px;
      }

      .dialog-center h2 {
        font-size: 24px;
      }

      .knowledge-popover,
      .selected-kb-card {
        position: static;
        width: 100%;
        margin: 12px 0;
        transform: none;
      }

      .dialog-tools {
        align-items: stretch;
        flex-direction: column;
      }

      .tool-left,
      .tool-right {
        flex-wrap: wrap;
      }

      .member-summary,

      }

        align-items: stretch;
        flex-direction: column;
      }

      .wiki-main {
        padding: 18px;
      }

      .graph-canvas {
        min-height: 520px;
        overflow: auto;
      }

      .graph-svg {
        min-width: 760px;
        height: 540px;
      }
    }

    @media (max-width: 560px) {
      .brand {
        align-items: flex-start;
      }

      .side-footer {
        display: grid;
      }

      .utility-controls {

      }

      .main {
        padding: 18px 12px 26px;
      }

      .title-block h1 {
        font-size: 24px;
      }

      .button-row,
      .prompt-chips,

        justify-content: flex-start;
      }

      .btn,
      .prompt-chip,
      .settings-tab,
      .tab {
        white-space: normal;
      }

      .dialog-hero {
        min-height: auto;
      }

      .settings-window {
        width: calc(100vw - 16px);
        height: calc(100vh - 16px);
      }

      .settings-content {
        padding: 20px 14px 24px;
      }

      .metric-grid,
      .member-summary {
        gap: 8px;
      }

      .file-row,
      .queue-row,
      .concept-row,
      .source-row,
      .legend-item,
      .card-foot {
        align-items: flex-start;
        flex-direction: column;
      }

      .message {
        max-width: 100%;
      }

      { path: "/Discovery/Interface/API_List.xlsx", sourceType: "xlsx", sizeLabel: "780 KB", supported: true, confidence: 0.78, targetStatus: "LOW_CONFIDENCE" },
      { path: "/Discovery/Reports/RPG_Scan_Result.pdf", sourceType: "pdf", sizeLabel: "3.4 MB", supported: true, confidence: 0.82, targetStatus: "REVIEW_REQUIRED" },
      { path: "/Discovery/Screens/Green_Screen_Flow.png", sourceType: "image", sizeLabel: "920 KB", supported: true, confidence: 0.64, targetStatus: "OCR_REQUIRED" },
      { path: "/Discovery/Runbooks/Nightly_Batch.docx", sourceType: "docx", sizeLabel: "350 KB", supported: true, confidence: 0.58, targetStatus: "PDF_CONVERT_FAILED", errors: ["Mock conversion guard failed"] },
      { path: "/Discovery/Reviewed/Approved_Scope.pdf", sourceType: "pdf", sizeLabel: "610 KB", supported: true, confidence: 0.93, targetStatus: "APPROVED", reviewStatus: "APPROVED" },
      { path: "/Discovery/Published/Migration_Boundary.pdf", sourceType: "pdf", sizeLabel: "720 KB", supported: true, confidence: 0.96, targetStatus: "PUBLISHED", reviewStatus: "APPROVED" },
      { path: "/Discovery/raw/notes.zzz", sourceType: "unsupported", sizeLabel: "12 KB", supported: false, confidence: 0, reason: "unsupported type" },
      { path: "/Discovery/raw/legacy-export.bin", sourceType: "unsupported", sizeLabel: "2.1 MB", supported: false, confidence: 0, reason: "binary export" }
    ];

    function sourceFileName(path) {
      return path.split("/").filter(Boolean).pop() || path;
    }

    function createSourceTrace(file, index, batchId = "pending") {
      const page = file.supported ? (index % 6) + 1 : undefined;
      return {
        sourceFile: sourceFileName(file.path),
        sourcePath: file.path,
        page,
        chunkId: page ? `${batchId}:file-${String(index + 1).padStart(3, "0")}:page-${String(page).padStart(3, "0")}:block-01` : `${batchId}:file-${String(index + 1).padStart(3, "0")}:unsupported`
      };
    }

    function reviewStatusFor(file) {
      if (file.reviewStatus) return file.reviewStatus;
      if (!file.supported) return "REJECTED";
      return "REVIEW_REQUIRED";
    }

    function reportEntryFromFile(file, index, batchId = "pending") {
      const status = file.status || file.targetStatus || (file.supported ? "NEW" : "UNSUPPORTED");
      return {
        path: file.path,
        status,
        confidence: file.confidence,
        reviewStatus: reviewStatusFor(file),
        sourceTrace: file.sourceTrace || createSourceTrace(file, index, batchId),
        note: file.reason || (file.errors ? file.errors[0] : "")
      };
    }

    function deriveBatchMetrics(fileItems) {
      const pdfStatuses = ["PDF_CONVERTED", "MARKDOWN_GENERATED", "LOW_CONFIDENCE", "REVIEW_REQUIRED", "OCR_REQUIRED", "APPROVED", "PUBLISHED"];
      const markdownStatuses = ["MARKDOWN_GENERATED", "LOW_CONFIDENCE", "REVIEW_REQUIRED", "OCR_REQUIRED", "APPROVED", "PUBLISHED"];
      return {
        totalFiles: fileItems.length,
        pdfConverted: fileItems.filter((item) => pdfStatuses.includes(item.status)).length,
        markdownGenerated: fileItems.filter((item) => markdownStatuses.includes(item.status)).length,
        reviewRequired: fileItems.filter((item) => item.reviewStatus === "REVIEW_REQUIRED").length,
        failed: fileItems.filter((item) => ["PDF_CONVERT_FAILED", "FAILED"].includes(item.status)).length,
        unsupported: fileItems.filter((item) => item.status === "UNSUPPORTED").length
      };
    }

    function createFolderUploadProvider() {
      return {
        async createInventory(sourceKind) {
          const packageName = sourceKind === "zip" ? "2026-06 IBM i Discovery.zip" : "2026-06 IBM i Discovery Folder";
          const files = uploadSeedFiles.slice(0, UPLOAD_DISPLAY_CAP).map((file) => ({
            path: file.path,
            sourceType: file.sourceType,
            sizeLabel: file.sizeLabel,
            supported: file.supported,
            confidence: file.confidence,
            reviewStatus: reviewStatusFor(file),
            reason: file.reason,
            targetStatus: file.targetStatus,
            errors: file.errors
          }));
          const detectedCount = uploadSeedFiles.length;
          return {
            sourceKind,
            packageName,
            files,
            detectedCount,
            supportedCount: files.filter((file) => file.supported).length,
            unsupportedCount: files.filter((file) => !file.supported).length,
            truncated: detectedCount > files.length,
            displayCap: UPLOAD_DISPLAY_CAP
          };
        },
        async createBatch(inventory) {
          const batchId = `mock-${inventory.sourceKind}-20260702`;
          const fileItems = inventory.files.map((file, index) => ({
            path: file.path,
            sourceType: file.sourceType,
            status: file.supported ? file.targetStatus : "UNSUPPORTED",
            confidence: file.confidence,
            reviewStatus: reviewStatusFor(file),
            sourceTrace: createSourceTrace(file, index, batchId),
            errors: file.errors
          }));
          return {
            id: batchId,
            name: inventory.packageName,
            sourceKind: inventory.sourceKind,
            uploadedAt: "2026-07-02 09:30",
            owner: "Modernization CoE",
            fileItems,
            metrics: deriveBatchMetrics(fileItems),
            progress: [
              { key: "progressUploaded", value: 100 },
              { key: "progressPdf", value: 75 },
              { key: "progressMarkdown", value: 63 },
              { key: "progressReview", value: 25 }
            ],
            truncated: inventory.truncated,
            displayCap: inventory.displayCap,
            detectedCount: inventory.detectedCount
          };
        },
        async buildReport(batch) {
          const entries = batch.fileItems.map((file, index) => reportEntryFromFile(file, index, batch.id));
          return {
            batchId: batch.id,
            inventory: entries,
            unsupported: entries.filter((entry) => entry.status === "UNSUPPORTED"),
            conversionFailures: entries.filter((entry) => ["PDF_CONVERT_FAILED", "FAILED"].includes(entry.status)),
            lowConfidence: entries.filter((entry) => entry.status === "LOW_CONFIDENCE" || entry.confidence < 0.7),
            reviewRequired: entries.filter((entry) => entry.reviewStatus === "REVIEW_REQUIRED"),
            approvedPublished: entries.filter((entry) => ["APPROVED", "PUBLISHED"].includes(entry.status))
          };
        }
      };
    }

    function settingsModels() {
      const builtinSettingsModelIds = ["deepseek-flash", "dashscope-embedding"];
      return appData.models.filter((model) => builtinSettingsModelIds.includes(model.id) || model.createdInSettings);
    }

    function modelIcon(type) {
      return {
        chat: "□",
        embedding: "⌘",
        rerank: "⇅",
        vision: "◉",
        speech: "◇"
      }[type] || "□";
    }

    function modelDetail(model) {
      if (model.type === "embedding") return " · 向量维度 1024";
      if (model.type === "rerank") return " · Top-K rerank";
      if (model.type === "vision") return " · 多模态";
      if (model.type === "speech") return " · 语音转写";
      return "";
    }

    function addSettingsModel(type) {
      const text = copy();
      const nextNumber = appData.models.filter((model) => model.type === type && model.createdInSettings).length + 1;
      const labels = {
        chat: uiState.lang === "zh-CN" ? "自定义对话模型" : "Custom Chat Model",
        embedding: text.embeddingModels,
        rerank: text.rerankModels,
        vision: text.visionModels,
        speech: text.speechModels
      };
      const providers = {
        chat: "Custom API",
        embedding: "Ollama",
        rerank: "Custom API",
        vision: "GitHub Models",
        speech: "Custom API"
      };
      const names = {
        chat: "custom-chat",
        embedding: "custom-embedding",
        rerank: "custom-rerank",
        vision: "custom-vision",
        speech: "custom-speech"
      };
      const model = {
        id: `${type}-custom-${Date.now()}`,
        provider: providers[type] || "Custom API",
        source: type === "embedding" ? "Ollama" : "API",
        type,
        name: `${names[type] || "custom-model"}-${nextNumber}`,
        displayName: `${labels[type] || labels.chat} ${nextNumber}`,
        baseUrl: "",
        apiKeyStatus: "not_configured",
        supportsMultimodal: type === "vision",
        thinkingFormat: "none",
        note: "Session-only prototype model configuration.",
        createdInSettings: true
      };
      appData.models = [...appData.models, model];
      uiState.selectedModelId = model.id;
      uiState.modelCategory = type;
      uiState.modelMenuOpen = false;
      openModelEditor(model.id);
    }

    function openModelEditor(modelId) {
      const model = appData.models.find((item) => item.id === modelId);
      if (!model) return;
      uiState.selectedModelId = model.id;
      uiState.modelMenuOpen = false;
      uiState.modelEditorOpen = true;
      uiState.modelEditorDraft = { ...model, apiKeyEditing: false };
      renderModelSettings();
    }

    function closeModelEditor() {
      uiState.modelEditorOpen = false;
      uiState.modelEditorDraft = null;
      renderModelSettings();
    }

    function updateModelEditorDraft(patch) {
      uiState.modelEditorDraft = {
        ...uiState.modelEditorDraft,
        ...currentModelEditorFormValues(),
        ...patch
      };
      renderModelSettings();
    }

      if (!uiState.modelEditorDraft) return {};
      return {
        provider: document.querySelector("#modelEditorProvider")?.value || uiState.modelEditorDraft.provider,

    }

    function renderFileTree(files, options = {}) {

        const parts = file.path.split("/").filter(Boolean);
        const fileName = parts.pop() || file.path;
        parts.forEach((folder, index) => {
          const folderKey = parts.slice(0, index + 1).join("/");
          if (!seenFolders.has(folderKey)) {
            seenFolders.add(folderKey);
            rows.push(`<div class="file-folder file-depth-${Math.min(index, 3)}">${escapeHtml(folderKey)}</div>`);
          }
        });
        rows.push(`
          <div class="file-row file-depth-${Math.min(parts.length, 3)}">
            <span class="file-path">${escapeHtml(fileName)}</span>
            <span class="badge ${statusClass[file.status]}">${file.status}</span>
          </div>
        `);
      });
      if (options.truncated) {
        const text = copy();
        rows.push(`<div class="tree-note">${text.showingFirstN.replace("{shown}", shownFiles.length).replace("{total}", options.detectedCount || files.length)}</div>`);
      }
      return rows.join("");

      uiState.activeReport = null;
      uiState.uploadFlowState = "BATCH_CREATED";
