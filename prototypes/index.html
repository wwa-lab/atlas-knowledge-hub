<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Knowledge Hub</title>
  <style>
    :root {
      --bg: #f7f8f9;
      --panel: #ffffff;
      --panel-soft: #f4f6f7;
      --panel-raised: #ffffff;
      --ink: #18211f;
      --muted: #66726f;
      --line: #e1e5e4;
      --primary: #3f6f8f;
      --primary-dark: #2f536b;
      --primary-soft: #edf3f6;
      --blue: #4b6f9f;
      --orange: #a66f28;
      --red: #b94a48;
      --gray: #68757c;
      --green: #5f8272;
      --shadow: 0 1px 2px rgba(24, 33, 31, 0.05), 0 10px 24px rgba(24, 33, 31, 0.04);
      --radius: 8px;
    }

    [data-theme="night"] {
      --bg: #0f1115;
      --panel: #171a20;
      --panel-soft: #20242b;
      --panel-raised: #1b1f26;
      --ink: #e6e8ec;
      --muted: #9aa3af;
      --line: #2b3038;
      --primary: #6f93a6;
      --primary-dark: #a9c1cf;
      --primary-soft: #1d2830;
      --blue: #83a2c7;
      --orange: #c49a68;
      --red: #d0827c;
      --gray: #9aa3af;
      --green: #6fa586;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.24), 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--bg);
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
      min-width: 0;
    }

    .sidebar {
      position: sticky;
      top: 0;
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      color: var(--ink);
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 17px;
      font-weight: 800;
      min-width: 0;
    }

    .brand-mark {
      flex: 0 0 auto;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: #2f536b;
    }

    .side-nav {
      display: grid;
      gap: 5px;
      min-height: 0;
      overflow: auto;
    }

    .side-nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      color: var(--ink);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius);
    }

    .side-nav button.active,
    .side-nav button:hover {
      color: var(--primary-dark);
      background: var(--primary-soft);
      font-weight: 800;
    }

    .side-label {
      margin: 14px 8px 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .side-search {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 10px;
      margin-bottom: 10px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .side-recent {
      display: grid;
      gap: 4px;
      padding: 0 8px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      list-style: none;
    }

    .side-divider {
      height: 1px;
      margin: 10px 0;
      background: var(--line);
    }

    .side-workspace {
      padding: 10px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .workspace-title {
      margin: 0 0 4px;
      font-weight: 800;
    }

    .workspace-role {
      color: var(--muted);
      font-size: 12px;
    }

    .side-footer {
      margin-top: auto;
      padding-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      border-top: 1px solid var(--line);
    }

    .utility-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .utility-btn {
      min-height: 32px;
      padding: 6px 8px;
      color: var(--ink);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .utility-btn:hover {
      background: var(--primary-soft);
    }

    .main {
      width: 100%;
      min-width: 0;
      padding: 26px 28px 34px;
    }

    .page-head,
    .space-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .title-block h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }

    .title-block p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 13px;
      color: #fff;
      white-space: nowrap;
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(24, 33, 31, 0.08);
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn.secondary {
      color: var(--primary-dark);
      background: var(--panel);
      border-color: var(--line);
      box-shadow: none;
    }

    .dialog-hero {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 430px;
      padding: 34px 28px 46px;
      margin-bottom: 22px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: none;
    }

    .dialog-center {
      width: min(820px, 100%);
      text-align: center;
    }

    .dialog-center h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
    }

    .dialog-center p {
      margin: 12px 0 0;
      color: var(--muted);
    }

    .prompt-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 22px auto 24px;
    }

    .prompt-chip {
      padding: 9px 14px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: none;
    }

    .dialog-box {
      position: relative;
      z-index: 2;
      display: grid;
      min-height: 158px;
      padding: 14px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(24, 33, 31, 0.05);
    }

    .dialog-input {
      width: 100%;
      min-height: 70px;
      padding: 3px 2px;
      color: var(--ink);
      resize: none;
      background: transparent;
      border: 0;
      outline: none;
    }

    .dialog-input::placeholder {
      color: #8c9896;
    }

    .dialog-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .tool-left,
    .tool-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mini-btn,
    .icon-btn,
    .model-select {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 6px 10px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .icon-btn {
      width: 30px;
      padding: 0;
      border-color: transparent;
      color: #778481;
      background: transparent;
      font-size: 17px;
    }

    .send-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
    }

    .knowledge-popover {
      position: absolute;
      z-index: 3;
      bottom: 96px;
      left: 50%;
      width: 304px;
      padding: 12px;
      text-align: left;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(24, 33, 31, 0.12);
      transform: translateX(-150%);
    }

    .knowledge-popover h3 {
      margin: 2px 2px 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .kb-list {
      display: grid;
      gap: 4px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .kb-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 8px;
      color: var(--ink);
      border-radius: var(--radius);
    }

    .kb-item.selected {
      color: var(--primary-dark);
      background: var(--primary-soft);
    }

    .folder-icon {
      color: currentColor;
      font-size: 15px;
    }

    .kb-count {
      color: var(--muted);
      font-size: 12px;
    }

    .selected-kb-card {
      position: absolute;
      z-index: 4;
      bottom: 116px;
      left: 50%;
      width: 260px;
      padding: 14px 15px;
      text-align: left;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(24, 33, 31, 0.11);
      transform: translateX(6%);
    }

    .selected-kb-card strong {
      display: inline-block;
      margin-right: 8px;
      font-size: 15px;
    }

    .selected-kb-card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .section-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin: 8px 0 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .section-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .settings-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 16px;
    }

    .settings-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(14, 23, 18, 0.56);
    }

    .settings-modal.active {
      display: grid;
      place-items: center;
    }

    .settings-window {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      width: min(1080px, calc(100vw - 48px));
      height: min(760px, calc(100vh - 48px));
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
    }

    .settings-rail {
      padding: 18px 10px;
      background: var(--panel-soft);
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .settings-rail h2 {
      margin: 0 8px 14px;
      font-size: 18px;
    }

    .settings-content {
      position: relative;
      min-width: 0;
      padding: 26px 32px 34px;
      overflow: auto;
    }

    .settings-close {
      position: absolute;
      top: 20px;
      right: 22px;
      width: 34px;
      height: 34px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius);
      font-size: 26px;
      line-height: 1;
    }

    .settings-close:hover {
      color: var(--ink);
      background: var(--panel-soft);
    }

    .settings-subnav {
      display: grid;
      gap: 5px;
    }

    .settings-group-label {
      margin: 14px 8px 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .settings-subnav button {
      width: 100%;
      padding: 9px 10px;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius);
    }

    .settings-subnav button.active {
      color: var(--primary-dark);
      background: var(--primary-soft);
      font-weight: 800;
    }

    .settings-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }

    .settings-tab {
      padding: 8px 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .settings-tab.active {
      color: var(--primary-dark);
      background: var(--primary-soft);
      font-weight: 800;
    }

    .model-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .model-card {
      display: grid;
      gap: 10px;
      min-width: 0;
      min-height: 124px;
      padding: 14px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .model-card.active,
    .model-card:hover {
      border-color: color-mix(in srgb, var(--primary) 32%, var(--line));
    }

    .model-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .model-head strong {
      display: block;
      margin-bottom: 4px;
      overflow-wrap: anywhere;
    }

    .model-provider {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .model-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .config-panel {
      position: sticky;
      top: 24px;
      align-self: start;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .config-section {
      padding-top: 16px;
      margin-top: 16px;
      border-top: 1px solid var(--line);
    }

    .config-section h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 15px;
    }

    .config-section h3::before {
      width: 3px;
      height: 16px;
      content: "";
      background: var(--primary);
      border-radius: 999px;
    }

    .field-grid {
      display: grid;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .field-note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .secret-row,
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 36px;
      padding: 8px 10px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .secret-row > span {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .secret-row .icon-btn {
      width: auto;
      min-width: 30px;
      padding: 0 8px;
      font-size: 13px;
      white-space: normal;
    }

    .toggle-pill {
      width: 34px;
      height: 20px;
      padding: 3px;
      background: #d9dfdd;
      border-radius: 999px;
    }

    .toggle-pill.on {
      background: #c6d8e0;
    }

    .toggle-pill::after {
      display: block;
      width: 14px;
      height: 14px;
      content: "";
      background: #fff;
      border-radius: 50%;
    }

    .toggle-pill.on::after {
      margin-left: 14px;
      background: var(--primary);
    }

    .member-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0;
    }

    .empty-invite {
      padding: 14px;
      margin-top: 10px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0 10px;
    }

    .table-toolbar input {
      width: min(300px, 100%);
      min-height: 36px;
      padding: 8px 10px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .member-table {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .member-row {
      display: grid;
      grid-template-columns: minmax(210px, 1.5fr) 150px 160px 120px;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
    }

    .member-row:last-child {
      border-bottom: 0;
    }

    .member-row.header {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      background: var(--panel-soft);
    }

    .member-name strong {
      display: block;
      margin-bottom: 4px;
    }

    .member-name span {
      color: var(--muted);
      font-size: 12px;
    }

    .role-select {
      min-height: 32px;
      padding: 6px 8px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .registration-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
    }

    .engine-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .engine-card {
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .engine-card.default {
      border-color: color-mix(in srgb, var(--primary) 32%, var(--line));
    }

    .engine-card h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card,
    .panel,
    .metric,
    .wiki-main,
    .wiki-rail,
    .graph-canvas,
    .review-pane,
    .chat-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card {
      display: grid;
      min-height: 218px;
      padding: 18px;
      text-align: left;
      border-color: var(--line);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--primary) 32%, var(--line));
      box-shadow: 0 6px 18px rgba(24, 33, 31, 0.08);
    }

    .card h2,
    .panel h2,
    .panel h3,
    .wiki-main h2,
    .wiki-rail h3,
    .review-pane h3,
    .chat-panel h3 {
      margin: 0;
      line-height: 1.25;
    }

    .card h2 {
      font-size: 18px;
    }

    .card p {
      margin: 10px 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: auto;
    }

    .stat {
      padding: 8px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .stat strong {
      display: block;
      font-size: 17px;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      border-radius: 999px;
    }

    .badge.healthy,
    .badge.approved {
      color: #3b684c;
      background: #eef5f1;
    }

    .badge.review,
    .badge.ocr {
      color: #8b6429;
      background: #f7f1e8;
    }

    .badge.parsing,
    .badge.medium {
      color: #3f5f84;
      background: #edf2f7;
    }

    .badge.failed,
    .badge.needfix {
      color: #944844;
      background: #f7eeee;
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .space-panel {
      padding: 18px;
      margin-bottom: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .space-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 2px;
      margin-bottom: 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      padding: 12px 14px;
      color: var(--muted);
      white-space: nowrap;
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: var(--primary-dark);
      font-weight: 800;
      border-color: var(--primary);
    }

    .tab-view {
      display: none;
    }

    .tab-view.active,
    .view.active {
      display: block;
    }

    .view {
      display: none;
    }

    .split,
    .review-grid,
    .ask-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 16px;
    }

    .doc-grid {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 16px;
    }

    .panel {
      padding: 16px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .metric {
      padding: 12px;
      box-shadow: none;
    }

    .metric strong {
      display: block;
      font-size: 22px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .progress-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .progress {
      height: 9px;
      overflow: hidden;
      background: #e8eceb;
      border-radius: 999px;
    }

    .progress span {
      display: block;
      height: 100%;
      background: #6f95aa;
    }

    .file-tree {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .file-row,
    .queue-row,
    .concept-row,
    .source-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 11px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .file-path,
    .queue-row span:first-child {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 13px;
    }

    .wiki-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 300px;
      gap: 16px;
    }

    .wiki-rail {
      padding: 15px;
      box-shadow: none;
    }

    .search {
      width: 100%;
      height: 38px;
      padding: 0 11px;
      margin: 12px 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .search:focus,
    textarea:focus,
    .ask-input:focus {
      border-color: color-mix(in srgb, var(--primary) 42%, var(--line));
      box-shadow: 0 0 0 3px rgba(63, 111, 143, 0.08);
    }

    .index-list,
    .recent-list,
    .related-list {
      display: grid;
      gap: 8px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .index-list button {
      width: 100%;
      padding: 9px 10px;
      color: var(--ink);
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .index-list button:hover,
    .index-list button.active {
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-color: color-mix(in srgb, var(--primary) 32%, var(--line));
    }

    .recent-list li,
    .related-list li {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .wiki-main {
      padding: 20px 24px;
      box-shadow: none;
    }

    .wiki-main header {
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .wiki-main h2 {
      font-size: 24px;
    }

    .wiki-section {
      padding: 12px 0;
      border-bottom: 1px solid #edf2ee;
      scroll-margin-top: 24px;
    }

    .wiki-section.highlight {
      padding-right: 12px;
      padding-left: 12px;
      margin-right: -12px;
      margin-left: -12px;
      background: var(--primary-soft);
      border-radius: var(--radius);
    }

    .wiki-section h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .wiki-section p,
    .wiki-section li {
      color: var(--ink);
      line-height: 1.68;
    }

    .concept {
      color: var(--primary-dark);
      font-weight: 800;
      text-decoration: underline;
      text-decoration-color: rgba(63, 111, 143, 0.28);
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .trace {
      padding: 10px 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      background: var(--panel-soft);
      border-left: 3px solid #b7c8d0;
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .metadata-list {
      display: grid;
      gap: 11px;
      margin-top: 14px;
    }

    .metadata-list div {
      padding-bottom: 10px;
      border-bottom: 1px solid #edf2ee;
    }

    .metadata-list strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .graph-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 16px;
    }

    .graph-canvas {
      position: relative;
      min-height: 600px;
      overflow: hidden;
      background: var(--panel-soft);
      box-shadow: none;
    }

    .graph-svg {
      display: block;
      width: 100%;
      min-width: 880px;
      height: 600px;
    }

    .graph-node {
      cursor: pointer;
    }

    .graph-label {
      pointer-events: none;
      font-size: 12px;
      font-weight: 700;
      fill: #1f2d25;
    }

    .graph-tooltip {
      position: absolute;
      z-index: 3;
      display: none;
      max-width: 260px;
      padding: 9px 11px;
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      background: rgba(18, 22, 27, 0.95);
      border-radius: var(--radius);
      pointer-events: none;
      box-shadow: var(--shadow);
    }

    .legend-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 7px;
      border-radius: 50%;
      vertical-align: -1px;
    }

    .dot.blue { background: var(--blue); }
    .dot.green { background: var(--green); }
    .dot.orange { background: var(--orange); }
    .dot.gray { background: var(--gray); }
    .dot.red { background: var(--red); }

    .review-grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .review-pane {
      min-height: 390px;
      padding: 16px;
      box-shadow: none;
    }

    .pdf-preview {
      display: grid;
      place-items: center;
      min-height: 270px;
      margin-top: 14px;
      color: var(--muted);
      text-align: center;
      background:
        linear-gradient(90deg, rgba(63, 111, 143, 0.06) 1px, transparent 1px),
        linear-gradient(rgba(63, 111, 143, 0.06) 1px, transparent 1px),
        var(--panel-soft);
      background-size: 26px 26px;
      border: 1px dashed #cfd8dc;
      border-radius: var(--radius);
    }

    .markdown-preview {
      min-height: 250px;
      padding: 14px;
      margin-top: 12px;
      color: var(--ink);
      line-height: 1.62;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    textarea {
      width: 100%;
      min-height: 82px;
      padding: 10px;
      margin-top: 12px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .queue {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .ask-grid {
      grid-template-columns: minmax(0, 1fr) 320px;
    }

    .chat-panel {
      padding: 16px;
      box-shadow: none;
    }

    .message {
      max-width: 86%;
      padding: 12px 13px;
      margin-bottom: 12px;
      line-height: 1.55;
      border-radius: var(--radius);
    }

    .message.user {
      margin-left: auto;
      color: #fff;
      background: var(--primary);
    }

    .message.answer {
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .references {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 12px 0 0;
      list-style: none;
    }

    .references li {
      padding: 9px 10px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    [data-theme="night"] .sidebar {
      background: #12151b;
    }

    [data-theme="night"] .card:hover {
      border-color: #3a4652;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
    }

    [data-theme="night"] .prompt-chip,
    [data-theme="night"] .mini-btn,
    [data-theme="night"] .model-select,
    [data-theme="night"] .index-list button,
    [data-theme="night"] .references li {
      color: var(--ink);
    }

    [data-theme="night"] .kb-item,
    [data-theme="night"] .file-path,
    [data-theme="night"] .wiki-section p,
    [data-theme="night"] .wiki-section li,
    [data-theme="night"] .markdown-preview,
    [data-theme="night"] .references li {
      color: var(--ink);
    }

    [data-theme="night"] .trace {
      color: #c8d0d8;
      background: #20242b;
    }

    [data-theme="night"] .graph-label {
      fill: #d9dee5;
    }

    [data-theme="night"] .badge.healthy,
    [data-theme="night"] .badge.approved {
      color: #a8d6ba;
      background: rgba(111, 165, 134, 0.16);
    }

    [data-theme="night"] .badge.review,
    [data-theme="night"] .badge.ocr {
      color: #e1bd82;
      background: rgba(196, 154, 104, 0.15);
    }

    [data-theme="night"] .badge.parsing,
    [data-theme="night"] .badge.medium {
      color: #b5c9e3;
      background: rgba(131, 162, 199, 0.15);
    }

    [data-theme="night"] .badge.failed,
    [data-theme="night"] .badge.needfix {
      color: #e5aaa6;
      background: rgba(208, 130, 124, 0.14);
    }

    [data-theme="night"] .progress {
      background: #272c34;
    }

    [data-theme="night"] .progress span {
      background: #7898aa;
    }

    [data-theme="night"] .wiki-section,
    [data-theme="night"] .metadata-list div {
      border-color: var(--line);
    }

    [data-theme="night"] .pdf-preview {
      background:
        linear-gradient(90deg, rgba(154, 163, 175, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(154, 163, 175, 0.08) 1px, transparent 1px),
        var(--panel-soft);
      border-color: #3a414c;
    }

    .ask-input-row {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .ask-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .hidden {
      display: none !important;
    }

    @media (min-width: 1600px) {
      .main {
        padding: 34px 44px 44px;
      }

      .dialog-center {
        width: min(960px, 100%);
      }

      .wiki-layout {
        grid-template-columns: 300px minmax(0, 1fr) 340px;
      }

      .graph-layout {
        grid-template-columns: minmax(0, 1fr) 360px;
      }
    }

    @media (max-width: 1366px) {
      .shell {
        grid-template-columns: 236px minmax(0, 1fr);
      }

      .main {
        padding: 22px 22px 30px;
      }

      .cards,
      .split,
      .doc-grid,
      .wiki-layout,
      .graph-layout,
      .review-grid,
      .ask-grid {
        gap: 14px;
      }

      .wiki-layout {
        grid-template-columns: 230px minmax(0, 1fr) 260px;
      }

      .graph-layout {
        grid-template-columns: minmax(0, 1fr) 280px;
      }

      .doc-grid {
        grid-template-columns: 320px minmax(0, 1fr);
      }
    }

    @media (max-width: 1180px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .knowledge-popover {
        left: 26px;
        transform: none;
      }

      .selected-kb-card {
        right: 26px;
        left: auto;
        transform: none;
      }

      .wiki-layout,
      .graph-layout,
      .doc-grid,
      .split,
      .ask-grid,
      .settings-layout,
      .settings-window,
      .registration-grid {
        grid-template-columns: 1fr;
      }

      .settings-window {
        height: min(820px, calc(100vh - 32px));
      }

      .settings-rail {
        max-height: 220px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .config-panel {
        position: static;
      }

      .metric-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 900px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        padding: 14px 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .side-nav {
        display: flex;
        gap: 6px;
        padding-bottom: 2px;
        overflow-x: auto;
      }

      .side-nav button {
        flex: 0 0 auto;
        width: auto;
        min-height: 34px;
        white-space: nowrap;
      }

      .side-label,
      .side-search,
      .side-recent,
      .side-divider,
      .side-workspace {
        display: none;
      }

      .side-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding-top: 10px;
      }

      .main {
        padding: 22px 18px 30px;
      }

      .page-head,
      .space-head {
        flex-direction: column;
      }

      .button-row {
        justify-content: flex-start;
      }

      .settings-window {
        width: min(100vw - 28px, 780px);
        height: min(840px, calc(100vh - 28px));
      }

      .settings-content {
        padding: 22px 22px 30px;
      }

      .member-table {
        overflow-x: auto;
      }

      .member-row {
        min-width: 720px;
      }
    }

    @media (max-width: 760px) {
      .review-grid,
      .ask-input-row {
        flex-direction: column;
        grid-template-columns: 1fr;
      }

      .cards,
      .model-grid,
      .engine-grid,
      .metric-grid,
      .stats {
        grid-template-columns: 1fr;
      }

      .dialog-hero {
        min-height: 520px;
        padding: 26px 16px 34px;
      }

      .dialog-center h2 {
        font-size: 24px;
      }

      .knowledge-popover,
      .selected-kb-card {
        position: static;
        width: 100%;
        margin: 12px 0;
        transform: none;
      }

      .dialog-tools {
        align-items: stretch;
        flex-direction: column;
      }

      .tool-left,
      .tool-right {
        flex-wrap: wrap;
      }

      .member-summary,
      .member-row {
        min-width: 0;
        grid-template-columns: 1fr;
      }

      .table-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .wiki-main {
        padding: 18px;
      }

      .graph-canvas {
        min-height: 520px;
        overflow: auto;
      }

      .graph-svg {
        min-width: 760px;
        height: 540px;
      }
    }

    @media (max-width: 560px) {
      .brand {
        align-items: flex-start;
      }

      .side-footer {
        display: grid;
      }

      .utility-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .main {
        padding: 18px 12px 26px;
      }

      .title-block h1 {
        font-size: 24px;
      }

      .button-row,
      .prompt-chips,
      .tabs,
      .settings-tabs {
        justify-content: flex-start;
      }

      .btn,
      .prompt-chip,
      .settings-tab,
      .tab {
        white-space: normal;
      }

      .dialog-hero {
        min-height: auto;
      }

      .settings-window {
        width: calc(100vw - 16px);
        height: calc(100vh - 16px);
      }

      .settings-content {
        padding: 20px 14px 24px;
      }

      .metric-grid,
      .member-summary {
        gap: 8px;
      }

      .file-row,
      .queue-row,
      .concept-row,
      .source-row,
      .legend-item,
      .card-foot {
        align-items: flex-start;
        flex-direction: column;
      }

      .message {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>Atlas Knowledge Hub</div>

      <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
      <div class="side-footer">

    // Interactions
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function linkConcepts(text) {
      const concepts = Object.keys(appData.wiki.concepts).sort((a, b) => b.length - a.length);
      return concepts.reduce((result, concept) => {
        const escaped = concept.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        return result.replace(new RegExp(escaped, "g"), `<span class="concept" title="${appData.wiki.concepts[concept]}">${concept}</span>`);
      }, text);
    }

    function showHome() {
      uiState.view = "home";
      uiState.settingsOpen = false;
      homeView.classList.add("active");
      spaceView.classList.remove("active");
      settingsView.classList.remove("active");
      document.querySelectorAll("#sideNav button").forEach((button, index) => {
        button.classList.toggle("active", index === 0);
      });
    }

    function showSpace(tab = "wiki") {
      uiState.view = "space";
      uiState.activeTab = tab;
      uiState.settingsOpen = false;
      renderSpace(tab);
      homeView.classList.remove("active");
      spaceView.classList.add("active");
      settingsView.classList.remove("active");
      document.querySelectorAll("#sideNav button").forEach((button) => {
        button.classList.toggle("active", button.dataset.navKey === "all");
      });
    }

    function showSettings(panel = uiState.settingsPanel) {
      uiState.settingsOpen = true;
      uiState.settingsPanel = panel;
      renderSettings();
      settingsView.classList.add("active");
      renderNav();
    }

    function closeSettings() {
      uiState.settingsOpen = false;
      settingsView.classList.remove("active");
      renderNav();
    }

    function setTab(tab) {
      uiState.activeTab = tab;
      document.querySelectorAll(".tab").forEach((button) => button.classList.toggle("active", button.dataset.tab === tab));
      document.querySelectorAll(".tab-view").forEach((view) => view.classList.toggle("active", view.id === `tab-${tab}`));
      if (tab === "graph") {
        renderGraphSvg();
      }
    }

    function renderApp() {
      const shouldKeepSettingsOpen = uiState.settingsOpen;
      const activeSettingsPanel = uiState.settingsPanel;
      applyPreferences();
      renderNav();
      renderHome();
      if (uiState.view === "space") {
        showSpace(uiState.activeTab);
      } else {
        showHome();
      }
      if (shouldKeepSettingsOpen) {
        uiState.settingsOpen = true;
        showSettings(activeSettingsPanel);
      }
    }

    function legendItems() {
      const counts = appData.graph.nodes.reduce((acc, node) => {
        acc[node.type] = (acc[node.type] || 0) + 1;
        return acc;
      }, {});
      const text = copy();
      return [
        { label: text.wikiPageNode, color: "blue", count: counts["Wiki Page"] || 0 },
        { label: text.entityNode, color: "green", count: counts.Entity || 0 },
        { label: text.conceptNode, color: "orange", count: counts.Concept || 0 },
        { label: text.documentNode, color: "gray", count: counts.Document || 0 },
        { label: text.reviewRequiredNode, color: "red", count: counts["Review Required"] || 0 }
      ];
    }

    function renderGraphSvg() {
      const svg = document.querySelector("#graphSvg");
      if (!svg) return;
      const nodeById = Object.fromEntries(appData.graph.nodes.map((node) => [node.id, node]));
      const edges = appData.graph.edges.map(([from, to]) => {
        const a = nodeById[from];
        const b = nodeById[to];
        return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--line)" stroke-width="1.5" />`;
      }).join("");
      const nodes = appData.graph.nodes.map((node) => `
        <g class="graph-node" data-node="${node.id}">
          <circle cx="${node.x}" cy="${node.y}" r="${node.r}" fill="${graphColor[node.type]}" opacity="0.88"></circle>
          <circle cx="${node.x}" cy="${node.y}" r="${node.r + 5}" fill="none" stroke="${graphColor[node.type]}" opacity="0.1" stroke-width="8"></circle>
          <text class="graph-label" x="${node.x}" y="${node.y + node.r + 18}" text-anchor="middle">${node.label}</text>
        </g>
      `).join("");
      svg.innerHTML = `<g>${edges}</g><g>${nodes}</g>`;
    }

    function showNodeDetail(nodeId) {
      const node = appData.graph.nodes.find((item) => item.id === nodeId);
      const detail = document.querySelector("#nodeDetail");
      if (!node || !detail) return;
      detail.innerHTML = `
        <h3>${node.label}</h3>
        <p><span class="badge" style="color:#fff;background:${graphColor[node.type]}">${node.type}</span></p>
        <p style="color:var(--muted);line-height:1.55;">${node.detail}</p>
      `;
    }

    function bindEvents() {
      document.addEventListener("click", (event) => {
        if (event.target.id === "languageToggle") {
          uiState.lang = uiState.lang === "zh-CN" ? "en-US" : "zh-CN";
          localStorage.setItem("atlas-lang", uiState.lang);
          renderApp();
          return;
        }

        if (event.target.id === "themeToggle") {
          uiState.theme = uiState.theme === "day" ? "night" : "day";
          localStorage.setItem("atlas-theme", uiState.theme);
          renderApp();
          return;
        }

        const spaceCard = event.target.closest("[data-space]");
        if (spaceCard && spaceCard.dataset.space === "IBM i Modernization") {
          showSpace("wiki");
        }

        const promptChip = event.target.closest("[data-prompt]");
        if (promptChip) {
          const input = document.querySelector("#homeDialogInput");
          uiState.homeQuestion = promptChip.dataset.prompt;
          if (input) {
            input.value = uiState.homeQuestion;
            input.focus();
          }
        }

        const kbItem = event.target.closest(".kb-item");
        if (kbItem && kbItem.dataset.kb === "IBM i Modernization") {
          showSpace("ask");
        }

        const navButton = event.target.closest("[data-nav]");
        if (navButton) {
          if (navButton.dataset.navKey === "space") showSpace("wiki");
          else showHome();
        }

        const openSettingsButton = event.target.closest("[data-open-settings]");
        if (openSettingsButton) {
          showSettings("general");
        }

        if (event.target.id === "closeSettings" || event.target.id === "settingsView") {
          closeSettings();
        }

        const settingsPanel = event.target.closest("[data-settings-panel]");
        if (settingsPanel) {
          showSettings(settingsPanel.dataset.settingsPanel);
        }

        const modelCategory = event.target.closest("[data-model-category]");
        if (modelCategory) {
          uiState.selectedModelCategory = modelCategory.dataset.modelCategory;
          showSettings("models");
        }

        const modelCard = event.target.closest("[data-model-id]");
        if (modelCard) {
          uiState.selectedModelId = modelCard.dataset.modelId;
          showSettings("models");
        }

        if (event.target.id === "backHome") {
          showHome();
        }

        const tab = event.target.closest("[data-tab]");
        if (tab) {
          setTab(tab.dataset.tab);
        }

        const indexItem = event.target.closest("[data-section]");
        if (indexItem) {
          const target = document.getElementById(indexItem.dataset.section);
          document.querySelectorAll(".index-list button").forEach((button) => button.classList.remove("active"));
          document.querySelectorAll(".wiki-section").forEach((section) => section.classList.remove("highlight"));
          indexItem.classList.add("active");
          if (target) {
            target.classList.add("highlight");
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }

        const graphNode = event.target.closest(".graph-node");
        if (graphNode) {
          showNodeDetail(graphNode.dataset.node);
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.id === "homeDialogInput") {
          uiState.homeQuestion = event.target.value;
        }
      });

      document.addEventListener("mousemove", (event) => {
        const graphNode = event.target.closest(".graph-node");
        const tooltip = document.querySelector("#graphTooltip");
        if (!tooltip) return;
        if (!graphNode) {
          tooltip.style.display = "none";
          return;
        }
        const node = appData.graph.nodes.find((item) => item.id === graphNode.dataset.node);
        tooltip.innerHTML = `<strong>${node.label}</strong><br>${node.type}<br>${node.detail}`;
        tooltip.style.display = "block";
        const canvasRect = document.querySelector(".graph-canvas").getBoundingClientRect();
        tooltip.style.left = `${event.clientX - canvasRect.left + 14}px`;
        tooltip.style.top = `${event.clientY - canvasRect.top + 14}px`;
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && uiState.settingsOpen) {
          closeSettings();
        }
      });
    }

    renderApp();
    bindEvents();
  </script>
</body>
</html>
