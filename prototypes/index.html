<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Knowledge Hub Prototype</title>
  <style>
    :root {
      --bg: #f4f6f7;
      --panel: #ffffff;
      --panel-soft: #f8faf9;
      --ink: #17211b;
      --muted: #68766f;
      --line: #dde5df;
      --primary: #16834a;
      --primary-dark: #0f6b3a;
      --primary-soft: #e8f6ee;
      --blue: #2563eb;
      --orange: #d97706;
      --red: #dc2626;
      --gray: #64748b;
      --shadow: 0 12px 30px rgba(30, 50, 40, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      color: #d9e5de;
      background: #13201a;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-size: 17px;
      font-weight: 800;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #20a35b, #0f6b3a);
    }

    .side-nav {
      display: grid;
      gap: 7px;
    }

    .side-nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      color: #bfd0c6;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius);
    }

    .side-nav button.active,
    .side-nav button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .side-footer {
      position: absolute;
      right: 18px;
      bottom: 20px;
      left: 18px;
      padding-top: 14px;
      color: #93a99d;
      font-size: 12px;
      line-height: 1.5;
      border-top: 1px solid rgba(255, 255, 255, 0.13);
    }

    .main {
      min-width: 0;
      padding: 26px 28px 34px;
    }

    .page-head,
    .space-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .title-block h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.18;
    }

    .title-block p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 13px;
      color: #fff;
      white-space: nowrap;
      background: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      box-shadow: 0 7px 18px rgba(22, 131, 74, 0.17);
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn.secondary {
      color: var(--primary-dark);
      background: #fff;
      border-color: #bddccb;
      box-shadow: none;
    }

    .dialog-hero {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 430px;
      padding: 34px 28px 46px;
      margin-bottom: 22px;
      overflow: hidden;
      background:
        radial-gradient(circle at 28% 18%, rgba(22, 131, 74, 0.08), transparent 34%),
        linear-gradient(180deg, #fff, #f8fbf9);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .dialog-center {
      width: min(820px, 100%);
      text-align: center;
    }

    .dialog-center h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
    }

    .dialog-center p {
      margin: 12px 0 0;
      color: var(--muted);
    }

    .prompt-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 22px auto 24px;
    }

    .prompt-chip {
      padding: 9px 14px;
      color: #37453d;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(30, 50, 40, 0.06);
    }

    .dialog-box {
      position: relative;
      z-index: 2;
      display: grid;
      min-height: 158px;
      padding: 14px;
      text-align: left;
      background: #fff;
      border: 1.5px solid #17bf6b;
      border-radius: 12px;
      box-shadow: 0 18px 38px rgba(22, 131, 74, 0.13);
    }

    .dialog-input {
      width: 100%;
      min-height: 70px;
      padding: 3px 2px;
      color: #223027;
      resize: none;
      background: transparent;
      border: 0;
      outline: none;
    }

    .dialog-input::placeholder {
      color: #8a968f;
    }

    .dialog-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .tool-left,
    .tool-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mini-btn,
    .icon-btn,
    .model-select {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 6px 10px;
      color: #526158;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .icon-btn {
      width: 30px;
      padding: 0;
      border-color: transparent;
      color: #7a887f;
      background: transparent;
      font-size: 17px;
    }

    .send-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #17bf6b;
      border-radius: 50%;
    }

    .knowledge-popover {
      position: absolute;
      z-index: 3;
      bottom: 96px;
      left: 50%;
      width: 304px;
      padding: 12px;
      text-align: left;
      background: #fff;
      border: 1px solid #d4ddd7;
      border-radius: var(--radius);
      box-shadow: 0 18px 36px rgba(30, 50, 40, 0.16);
      transform: translateX(-150%);
    }

    .knowledge-popover h3 {
      margin: 2px 2px 10px;
      color: #4a584f;
      font-size: 13px;
      font-weight: 700;
    }

    .kb-list {
      display: grid;
      gap: 4px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .kb-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 8px;
      color: #26342d;
      border-radius: var(--radius);
    }

    .kb-item.selected {
      color: #08a85a;
      background: #e8f7ee;
    }

    .folder-icon {
      color: currentColor;
      font-size: 15px;
    }

    .kb-count {
      color: #7b887f;
      font-size: 12px;
    }

    .selected-kb-card {
      position: absolute;
      z-index: 4;
      bottom: 116px;
      left: 50%;
      width: 260px;
      padding: 14px 15px;
      text-align: left;
      background: #fff;
      border: 1px solid #dde5df;
      border-radius: var(--radius);
      box-shadow: 0 18px 36px rgba(30, 50, 40, 0.14);
      transform: translateX(6%);
    }

    .selected-kb-card strong {
      display: inline-block;
      margin-right: 8px;
      font-size: 15px;
    }

    .selected-kb-card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .section-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin: 8px 0 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .section-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card,
    .panel,
    .metric,
    .wiki-main,
    .wiki-rail,
    .graph-canvas,
    .review-pane,
    .chat-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card {
      display: grid;
      min-height: 218px;
      padding: 18px;
      text-align: left;
      border-color: var(--line);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #9ecfac;
      box-shadow: 0 18px 38px rgba(28, 69, 48, 0.13);
    }

    .card h2,
    .panel h2,
    .panel h3,
    .wiki-main h2,
    .wiki-rail h3,
    .review-pane h3,
    .chat-panel h3 {
      margin: 0;
      line-height: 1.25;
    }

    .card h2 {
      font-size: 18px;
    }

    .card p {
      margin: 10px 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: auto;
    }

    .stat {
      padding: 8px;
      background: var(--panel-soft);
      border: 1px solid #e5ece7;
      border-radius: var(--radius);
    }

    .stat strong {
      display: block;
      font-size: 17px;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      border-radius: 999px;
    }

    .badge.healthy,
    .badge.approved {
      color: #11663a;
      background: #e8f6ee;
    }

    .badge.review,
    .badge.ocr {
      color: #a05a00;
      background: #fff4df;
    }

    .badge.parsing,
    .badge.medium {
      color: #1f54b8;
      background: #e9f0ff;
    }

    .badge.failed,
    .badge.needfix {
      color: #b42318;
      background: #fff0ed;
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .space-panel {
      padding: 18px;
      margin-bottom: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .space-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 2px;
      margin-bottom: 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      padding: 12px 14px;
      color: var(--muted);
      white-space: nowrap;
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: var(--primary-dark);
      font-weight: 800;
      border-color: var(--primary);
    }

    .tab-view {
      display: none;
    }

    .tab-view.active,
    .view.active {
      display: block;
    }

    .view {
      display: none;
    }

    .split,
    .review-grid,
    .ask-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 16px;
    }

    .doc-grid {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 16px;
    }

    .panel {
      padding: 16px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .metric {
      padding: 12px;
      box-shadow: none;
    }

    .metric strong {
      display: block;
      font-size: 22px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .progress-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .progress {
      height: 9px;
      overflow: hidden;
      background: #e8eee9;
      border-radius: 999px;
    }

    .progress span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #21a55d, #73c791);
    }

    .file-tree {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .file-row,
    .queue-row,
    .concept-row,
    .source-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 11px;
      background: var(--panel-soft);
      border: 1px solid #e4ebe6;
      border-radius: var(--radius);
    }

    .file-path,
    .queue-row span:first-child {
      min-width: 0;
      overflow-wrap: anywhere;
      color: #26342d;
      font-size: 13px;
    }

    .wiki-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 300px;
      gap: 16px;
    }

    .wiki-rail {
      padding: 15px;
      box-shadow: none;
    }

    .search {
      width: 100%;
      height: 38px;
      padding: 0 11px;
      margin: 12px 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .search:focus,
    textarea:focus,
    .ask-input:focus {
      border-color: #8ccaa4;
      box-shadow: 0 0 0 3px rgba(22, 131, 74, 0.1);
    }

    .index-list,
    .recent-list,
    .related-list {
      display: grid;
      gap: 8px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .index-list button {
      width: 100%;
      padding: 9px 10px;
      color: #304039;
      text-align: left;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .index-list button:hover,
    .index-list button.active {
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-color: #aad5ba;
    }

    .recent-list li,
    .related-list li {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .wiki-main {
      padding: 20px 24px;
      box-shadow: none;
    }

    .wiki-main header {
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .wiki-main h2 {
      font-size: 24px;
    }

    .wiki-section {
      padding: 12px 0;
      border-bottom: 1px solid #edf2ee;
      scroll-margin-top: 24px;
    }

    .wiki-section.highlight {
      padding-right: 12px;
      padding-left: 12px;
      margin-right: -12px;
      margin-left: -12px;
      background: #f0fbf4;
      border-radius: var(--radius);
    }

    .wiki-section h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .wiki-section p,
    .wiki-section li {
      color: #34443b;
      line-height: 1.68;
    }

    .concept {
      color: var(--primary-dark);
      font-weight: 800;
      text-decoration: underline;
      text-decoration-color: rgba(22, 131, 74, 0.35);
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .trace {
      padding: 10px 12px;
      margin-top: 10px;
      color: #526257;
      font-size: 12px;
      line-height: 1.5;
      background: #f3f7f4;
      border-left: 3px solid #98cdaa;
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .metadata-list {
      display: grid;
      gap: 11px;
      margin-top: 14px;
    }

    .metadata-list div {
      padding-bottom: 10px;
      border-bottom: 1px solid #edf2ee;
    }

    .metadata-list strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .graph-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 16px;
    }

    .graph-canvas {
      position: relative;
      min-height: 600px;
      overflow: hidden;
      background: #fbfdfc;
      box-shadow: none;
    }

    .graph-svg {
      display: block;
      width: 100%;
      min-width: 880px;
      height: 600px;
    }

    .graph-node {
      cursor: pointer;
    }

    .graph-label {
      pointer-events: none;
      font-size: 12px;
      font-weight: 700;
      fill: #1f2d25;
    }

    .graph-tooltip {
      position: absolute;
      z-index: 3;
      display: none;
      max-width: 260px;
      padding: 9px 11px;
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      background: rgba(17, 32, 25, 0.95);
      border-radius: var(--radius);
      pointer-events: none;
      box-shadow: var(--shadow);
    }

    .legend-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      background: var(--panel-soft);
      border: 1px solid #e5ece7;
      border-radius: var(--radius);
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 7px;
      border-radius: 50%;
      vertical-align: -1px;
    }

    .dot.blue { background: var(--blue); }
    .dot.green { background: var(--primary); }
    .dot.orange { background: var(--orange); }
    .dot.gray { background: var(--gray); }
    .dot.red { background: var(--red); }

    .review-grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .review-pane {
      min-height: 390px;
      padding: 16px;
      box-shadow: none;
    }

    .pdf-preview {
      display: grid;
      place-items: center;
      min-height: 270px;
      margin-top: 14px;
      color: #748278;
      text-align: center;
      background:
        linear-gradient(90deg, rgba(22, 131, 74, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(22, 131, 74, 0.08) 1px, transparent 1px),
        #f9fbfa;
      background-size: 26px 26px;
      border: 1px dashed #bad2c3;
      border-radius: var(--radius);
    }

    .markdown-preview {
      min-height: 250px;
      padding: 14px;
      margin-top: 12px;
      color: #314139;
      line-height: 1.62;
      background: var(--panel-soft);
      border: 1px solid #e5ece7;
      border-radius: var(--radius);
    }

    textarea {
      width: 100%;
      min-height: 82px;
      padding: 10px;
      margin-top: 12px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .queue {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .ask-grid {
      grid-template-columns: minmax(0, 1fr) 320px;
    }

    .chat-panel {
      padding: 16px;
      box-shadow: none;
    }

    .message {
      max-width: 86%;
      padding: 12px 13px;
      margin-bottom: 12px;
      line-height: 1.55;
      border-radius: var(--radius);
    }

    .message.user {
      margin-left: auto;
      color: #fff;
      background: var(--primary);
    }

    .message.answer {
      background: var(--panel-soft);
      border: 1px solid #e5ece7;
    }

    .references {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 12px 0 0;
      list-style: none;
    }

    .references li {
      padding: 9px 10px;
      color: #405249;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .ask-input-row {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .ask-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: none;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1180px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .knowledge-popover {
        left: 26px;
        transform: none;
      }

      .selected-kb-card {
        right: 26px;
        left: auto;
        transform: none;
      }

      .wiki-layout,
      .graph-layout,
      .doc-grid,
      .split,
      .ask-grid {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 760px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;

                <h3>${section.title}</h3>
                <p>${linkConcepts(section.body)}</p>
                <div class="trace">source_trace: BRD_Methodology.pdf / page 12; RPG_Scan_Result.pdf / page 6; review_status: REVIEW_REQUIRED; confidence: medium</div>
              </section>
            `).join("")}
          </article>
          <aside class="wiki-rail">
            <h3>Metadata</h3>
            <div class="metadata-list">
              <div><strong>Source Documents</strong>${wiki.metadata.sourceDocuments}</div>
              <div><strong>Confidence</strong>${wiki.metadata.confidence}</div>
              <div><strong>Review Status</strong><span class="badge review">${wiki.metadata.reviewStatus}</span></div>
              <div><strong>Last Updated</strong>${wiki.metadata.lastUpdated}</div>
              <div><strong>Owner</strong>${wiki.metadata.owner}</div>
              <div><strong>Related Concepts</strong>
                <ul class="related-list">${wiki.metadata.relatedConcepts.map((item) => `<li>${item}</li>`).join("")}</ul>
              </div>
            </div>
          </aside>
        </div>
      `;
    }

    function renderGraph() {
      return `
        <div class="graph-layout">
          <section class="graph-canvas">
            <div class="graph-tooltip" id="graphTooltip"></div>
            <svg class="graph-svg" id="graphSvg" viewBox="0 0 900 600" role="img" aria-label="IBM i Modernization 知识图谱"></svg>
          </section>
          <aside class="panel">
            <h2>图谱概览</h2>
            <p style="color:var(--muted);line-height:1.55;">轻量图谱 mock。节点来自已发布 Wiki、源文档和待审核证据。</p>
            <div class="legend-list">
              ${legendItems().map((item) => `
                <div class="legend-item"><span><span class="dot ${item.color}"></span>${item.label}</span><strong>${item.count}</strong></div>
              `).join("")}
            </div>
            <div class="panel" style="margin-top:14px;box-shadow:none;" id="nodeDetail">
              <h3>Node Detail</h3>
              <p style="color:var(--muted);line-height:1.55;">点击图谱节点查看来源、类型和关系说明。</p>
            </div>
          </aside>
        </div>
      `;
    }

    function renderReview() {
      const review = appData.review;
      return `
        <div class="review-grid">
          <section class="review-pane">
            <h3>PDF Page Preview</h3>
            <p style="color:var(--muted);">Source: ${review.source} / page ${review.page}</p>
            <div class="pdf-preview">
              <div>
                <strong>PDF PAGE ${review.page}</strong>
                <p>表格、流程图和扫描文本预览占位</p>
              </div>
            </div>
          </section>
          <section class="review-pane">
            <div class="card-foot" style="margin-top:0;">
              <h3>Markdown Preview</h3>
              <span class="badge medium">Confidence ${review.confidence}</span>
            </div>
            <div class="markdown-preview">${review.markdown.replace(/\n/g, "<br>")}</div>
            <textarea placeholder="Review comments..."></textarea>
            <div class="button-row" style="justify-content:flex-start;margin-top:12px;">
              <button class="btn">Approve</button>
              <button class="btn secondary">Need Fix</button>
              <button class="btn secondary">Mark OCR Required</button>
            </div>
          </section>
        </div>
        <section class="panel" style="margin-top:16px;">
          <h2>Low confidence pages</h2>
          <div class="queue">
            ${review.queue.map((item) => `<div class="queue-row"><span>${item}</span><span class="badge review">REVIEW_REQUIRED</span></div>`).join("")}
          </div>
        </section>
      `;
    }

    function renderAsk() {
      const ask = appData.ask;
      return `
        <div class="ask-grid">
          <section class="chat-panel">
            <h3>Ask IBM i Modernization</h3>
            <div style="margin-top:16px;">
              <div class="message user">${ask.question}</div>
              <div class="message answer">
                ${ask.answer}
                <ul class="references">${ask.references.map((ref) => `<li>${ref}</li>`).join("")}</ul>
                <p><span class="badge medium">Confidence: ${ask.confidence}</span></p>
              </div>
            </div>
            <div class="ask-input-row">
              <input class="ask-input" placeholder="Ask about IBM i Modernization..." aria-label="Ask about IBM i Modernization">
              <button class="btn">发送</button>
            </div>
          </section>
          <aside class="panel">
            <h2>可信回答策略</h2>
            <p style="color:var(--muted);line-height:1.62;">Ask 只展示来自已审核或带有清晰 source_trace 的 mock 证据。Medium confidence 表示答案可用于探索，但仍建议打开来源页面核对。</p>
            <div class="source-row"><span>Approved Wiki pages</span><strong>42</strong></div>
            <div class="source-row" style="margin-top:10px;"><span>Evidence chunks</span><strong>318</strong></div>
            <div class="source-row" style="margin-top:10px;"><span>Review required</span><strong>35</strong></div>
          </aside>
        </div>
      `;
    }

    // Interactions
    function linkConcepts(text) {
      const concepts = Object.keys(appData.wiki.concepts).sort((a, b) => b.length - a.length);
      return concepts.reduce((result, concept) => {
        const escaped = concept.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        return result.replace(new RegExp(escaped, "g"), `<span class="concept" title="${appData.wiki.concepts[concept]}">${concept}</span>`);
      }, text);
    }

    function showHome() {
      homeView.classList.add("active");
      spaceView.classList.remove("active");
      document.querySelectorAll("#sideNav button").forEach((button, index) => {
        button.classList.toggle("active", index === 0);
      });
    }

    function showSpace(tab = "wiki") {
      renderSpace(tab);
      homeView.classList.remove("active");
      spaceView.classList.add("active");
      document.querySelectorAll("#sideNav button").forEach((button) => {
        button.classList.toggle("active", button.dataset.nav === "本空间");
      });
    }

    function setTab(tab) {
      document.querySelectorAll(".tab").forEach((button) => button.classList.toggle("active", button.dataset.tab === tab));
      document.querySelectorAll(".tab-view").forEach((view) => view.classList.toggle("active", view.id === `tab-${tab}`));
      if (tab === "图谱") {
        renderGraphSvg();
      }
    }

    function legendItems() {
      const counts = appData.graph.nodes.reduce((acc, node) => {
        acc[node.type] = (acc[node.type] || 0) + 1;
        return acc;
      }, {});
      return [
        { label: "Wiki Page", color: "blue", count: counts["Wiki Page"] || 0 },
        { label: "Entity", color: "green", count: counts.Entity || 0 },
        { label: "Concept", color: "orange", count: counts.Concept || 0 },
        { label: "Document", color: "gray", count: counts.Document || 0 },
        { label: "Review Required", color: "red", count: counts["Review Required"] || 0 }
      ];
    }

    function renderGraphSvg() {
      const svg = document.querySelector("#graphSvg");
      if (!svg) return;
      const nodeById = Object.fromEntries(appData.graph.nodes.map((node) => [node.id, node]));
      const edges = appData.graph.edges.map(([from, to]) => {
        const a = nodeById[from];
        const b = nodeById[to];
        return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#cbd8d0" stroke-width="1.5" />`;
      }).join("");
      const nodes = appData.graph.nodes.map((node) => `
        <g class="graph-node" data-node="${node.id}">
          <circle cx="${node.x}" cy="${node.y}" r="${node.r}" fill="${graphColor[node.type]}" opacity="0.92"></circle>
          <circle cx="${node.x}" cy="${node.y}" r="${node.r + 5}" fill="none" stroke="${graphColor[node.type]}" opacity="0.16" stroke-width="8"></circle>
          <text class="graph-label" x="${node.x}" y="${node.y + node.r + 18}" text-anchor="middle">${node.label}</text>
        </g>
      `).join("");
      svg.innerHTML = `<g>${edges}</g><g>${nodes}</g>`;
    }

    function showNodeDetail(nodeId) {
      const node = appData.graph.nodes.find((item) => item.id === nodeId);
      const detail = document.querySelector("#nodeDetail");
      if (!node || !detail) return;
      detail.innerHTML = `
        <h3>${node.label}</h3>
        <p><span class="badge" style="color:#fff;background:${graphColor[node.type]}">${node.type}</span></p>
        <p style="color:var(--muted);line-height:1.55;">${node.detail}</p>
      `;
    }

    function bindEvents() {
      document.addEventListener("click", (event) => {
        const spaceCard = event.target.closest("[data-space]");
        if (spaceCard && spaceCard.dataset.space === "IBM i Modernization") {
          showSpace("wiki");
        }

        const promptChip = event.target.closest("[data-prompt]");
        if (promptChip) {
          const input = document.querySelector("#homeDialogInput");
          if (input) {
            input.value = promptChip.dataset.prompt;
            input.focus();
          }
        }

        const kbItem = event.target.closest(".kb-item");
        if (kbItem && kbItem.textContent.includes("IBM i Modernization")) {
          showSpace("ask");
        }

        const navButton = event.target.closest("[data-nav]");
        if (navButton) {
          if (navButton.dataset.nav === "本空间") showSpace("wiki");
          else showHome();
        }

        if (event.target.id === "backHome") {
          showHome();
        }

        const tab = event.target.closest("[data-tab]");
        if (tab) {
          setTab(tab.dataset.tab);
        }

        const indexItem = event.target.closest("[data-section]");
        if (indexItem) {
          const target = document.getElementById(indexItem.dataset.section);
          document.querySelectorAll(".index-list button").forEach((button) => button.classList.remove("active"));
          document.querySelectorAll(".wiki-section").forEach((section) => section.classList.remove("highlight"));
          indexItem.classList.add("active");
          if (target) {
            target.classList.add("highlight");
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }

        const graphNode = event.target.closest(".graph-node");
        if (graphNode) {
          showNodeDetail(graphNode.dataset.node);
        }
      });

      document.addEventListener("mousemove", (event) => {
        const graphNode = event.target.closest(".graph-node");
        const tooltip = document.querySelector("#graphTooltip");
        if (!tooltip) return;
        if (!graphNode) {
          tooltip.style.display = "none";
          return;
        }
        const node = appData.graph.nodes.find((item) => item.id === graphNode.dataset.node);
        tooltip.innerHTML = `<strong>${node.label}</strong><br>${node.type}<br>${node.detail}`;
        tooltip.style.display = "block";
        const canvasRect = document.querySelector(".graph-canvas").getBoundingClientRect();
        tooltip.style.left = `${event.clientX - canvasRect.left + 14}px`;
        tooltip.style.top = `${event.clientY - canvasRect.top + 14}px`;
      });
    }

    renderNav();
    renderHome();
    bindEvents();
  </script>
</body>
</html>
