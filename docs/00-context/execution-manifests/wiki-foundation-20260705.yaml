      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
    - path: ROADMAP.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
    - path: ROADMAP.zh-CN.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
    - path: docs/07-acceptance/product-acceptance-report.zh-CN.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
    - path: docs/07-acceptance/internal-beta-readiness.zh-CN.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
    - path: docs/00-context/wiki-foundation-goal-plan.zh-CN.md
      required: true
      version: local-created
    - path: docs/03-spec/full-stack-productization-spec.zh-CN.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
    - path: docs/06-tasks/full-stack-productization-tasks.zh-CN.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
    - path: docs/00-context/full-stack-productization-traceability.zh-CN.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
  skill_files:
    - path: .agents/skills/atlas-sdd-generate-all/SKILL.md
      required: true
      purpose: Full Atlas SDD orchestration, slice contract, bilingual artifact set, and final consistency gate.
    - path: .agents/skills/req-to-user-story/SKILL.md
      required: true
      purpose: Convert slice requirements into user stories and acceptance criteria.
    - path: .agents/skills/user-story-to-spec/SKILL.md
      required: true
      purpose: Convert user stories into implementation-facing behavior specification.
    - path: .agents/skills/spec-to-architecture/SKILL.md
      required: true
      purpose: Convert specification into architecture, data flow, and data model direction.
    - path: .agents/skills/architecture-to-design/SKILL.md
      required: true
      purpose: Convert architecture into detailed UX, API, component, and implementation design.
    - path: .agents/skills/design-to-tasks/SKILL.md
      required: true
      purpose: Convert design into executable Codex implementation tasks.
    - path: .agents/skills/review-doc-quality/SKILL.md
      required: true
      purpose: Review the generated bilingual SDD set for coverage, traceability, and consistency.
    - path: .agents/skills/architecture-review/SKILL.md
      required: false
      required_when: Slice materially changes architecture, adapter boundaries, API contracts, persistence, security, or data flow.
      purpose: Required when a slice materially changes architecture, adapter boundaries, API contracts, persistence, security, or data flow.
  implementation_files_to_inspect:
    - backend/src/main/java/com/atlas/metadata/domain/WikiPage.java
    - backend/src/main/java/com/atlas/metadata/service/ReviewPublishService.java
    - backend/src/main/java/com/atlas/metadata/service/IngestionService.java
    - backend/src/main/java/com/atlas/metadata/adapter/LocalPdfTextParserAdapter.java
    - backend/src/main/resources/db/migration/V1__init_schema.sql
    - backend/src/main/resources/db/migration/V8__ask_rag.sql
    - backend/src/main/resources/db/migration/V9__knowledge_graph_hardening.sql
    - frontend/src/App.vue
    - frontend/src/api.ts
    - frontend/src/types.ts

constraints:
  allowed_paths:
    - docs/00-context/
    - docs/01-requirements/
    - docs/02-user-stories/
    - docs/03-spec/
    - docs/04-architecture/
    - docs/05-design/
    - docs/06-tasks/
    - backend/src/main/java/com/atlas/metadata/
    - backend/src/main/resources/db/migration/
    - backend/src/test/java/com/atlas/metadata/
    - frontend/src/
    - frontend/tests/e2e/
  forbidden_paths:
    - .env
    - .claude/settings.local.json
    - frontend/node_modules/
    - backend/target/
    - frontend/dist/
    - frontend/playwright-report/
    - frontend/test-results/
    - samples/output/
    - tmp/
  external_actions_require_approval: true
  no_external_cloud_calls: true
  no_real_company_data: true
  no_raw_secrets: true
  no_weknora_code_copying: true
  sdd_generation_policy:
    must_use_project_local_skill_chain: true
    entry_skill: .agents/skills/atlas-sdd-generate-all/SKILL.md
    chain:
      - atlas-sdd-generate-all
      - req-to-user-story
      - user-story-to-spec
      - spec-to-architecture
      - architecture-to-design
      - design-to-tasks
      - review-doc-quality
    architecture_review_required_when_material_architecture_or_api_changes: true
    do_not_hand_write_all_sdd_docs_in_one_pass: true
    block_if_skill_chain_unavailable_or_unused: true
  adapter_boundaries_required:
    - parser
    - converter
    - model
    - vector
    - storage
    - search

