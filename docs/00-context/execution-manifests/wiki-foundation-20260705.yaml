workspace:
  project_name: atlas-knowledge-hub
  repo_path: ${ATLAS_REPO_ROOT}
  repo_url: null
  branch: develop-leo
  commit_sha: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442

task:
  title: Atlas next-phase plan from Wiki Foundation to internal beta
  objective: >
    Package the full next-phase wave plan and execute the first Wiki Foundation
    slice so Atlas can evolve from published Wiki metadata toward Auto Wiki,
    governance, Ask/Graph productization, connector, and operations capabilities
    without copying WeKnora implementation details or breaking existing API-backed
    product surfaces.
  mode: code-change
  sdd_profile: atlas-lightweight-product-sdd
  execution_strategy: sequential-slices
  recommended_first_slice: wiki-data-model
  slice_queue:
    - wave: 0
      slug: next-phase-gap-matrix
      purpose: Produce the explicit WeKnora-inspired MVP to Atlas implementation gap matrix.
    - wave: 0
      slug: readiness-language-cleanup
      purpose: Align roadmap/readiness wording with verified maturity evidence.
    - wave: 1
      slug: wiki-data-model
      purpose: Add Auto Wiki-ready page, folder, generation, log, and issue data foundations.
    - wave: 1
      slug: wiki-ingest-v0
      purpose: Generate review-required Wiki pages from approved source chunks through adapter-safe model calls.
    - wave: 1
      slug: wiki-linkify-lint
      purpose: Add Wiki linkification and basic quality issue detection.
    - wave: 1
      slug: real-office-parser-runtime
      purpose: Connect internal converter/parser runtimes through Atlas adapter boundaries.
    - wave: 2
      slug: wiki-index-log
      purpose: Add structured Wiki index summary and append-only operational logs.
    - wave: 2
      slug: wiki-refresh-retract
      purpose: Support source refresh, retract, stale markers, and protected manual edits.
    - wave: 2
      slug: wiki-review-gate
      purpose: Add review gates for generated Wiki pages before trusted publication.
    - wave: 2
      slug: knowledge-graph-quality
      purpose: Improve graph quality using Wiki/source evidence and edge review states.
    - wave: 3
      slug: auth-space-rbac
      purpose: Add SSO/current-user/space membership and backend RBAC foundations.
    - wave: 3
      slug: audit-log-foundation
      purpose: Add safe audit event capture and audit views for core operations.
    - wave: 3
      slug: secret-manager-integration
      purpose: Move runtime secrets behind masked/configured state and rotation flows.
    - wave: 3
      slug: rate-limit-safe-errors
      purpose: Add rate limiting and stable safe error envelopes for sensitive operations.
    - wave: 4
      slug: ask-session-citations
      purpose: Add Ask sessions, message history, streaming/stop contract, and citation snapshots.
    - wave: 4
      slug: answer-review-governance
      purpose: Add answer review queues, evidence sufficiency status, and model cost metadata.
    - wave: 4
      slug: graph-from-wiki-extraction
      purpose: Extract graph candidates from approved Wiki pages with evidence-backed review states.
    - wave: 4
      slug: retrieval-quality-metrics
      purpose: Add retrieval run summaries, Ask readiness indicators, and eval fixtures.
    - wave: 5
      slug: manual-url-knowledge-ingest
      purpose: Add manual Markdown and URL ingest with SSRF protection.
    - wave: 5
      slug: connector-sync-v0
      purpose: Add first low-risk connector model, sync job, sync log, and review pipeline integration.
    - wave: 5
      slug: worker-retry-dead-letter
      purpose: Add shared job states, retry policy, dead-letter, and operator-safe logs.
    - wave: 5
      slug: deployment-monitoring-runbook
      purpose: Add deployment topology, health checks, SLO draft, alert, and rollback runbooks.
  waves:
    - wave: 0
      name: maturity-and-plan-calibration
      purpose: Separate task completion, demo readiness, API-backed readiness, internal beta, and production readiness.
      status: planning
    - wave: 1
      name: wiki-foundation
      purpose: Build Auto Wiki data foundations, minimum ingest, linkify/lint, and real parser runtime slices.
      status: start-now
    - wave: 2
      name: wiki-hardening
      purpose: Add Wiki index/log, refresh/retract, review gates, and graph quality.
      status: gated-by-wave-1
    - wave: 3
      name: trust-and-governance
      purpose: Add auth, RBAC, audit, secret handling, rate limit, and safe errors for controlled internal use.
      status: gated-by-core-knowledge-loop
    - wave: 4
      name: ask-and-graph-productization
      purpose: Add Ask sessions/citation snapshots, answer review governance, graph extraction, and retrieval metrics.
      status: gated-by-trusted-wiki-and-governance
    - wave: 5
      name: connector-and-operations
      purpose: Add manual/URL ingest, connector sync, worker recovery, and deployment monitoring runbooks.
      status: gated-by-trust-and-governance

inputs:
  source_references:
    - type: local-file
      ref: ${WEKNORA_ANALYSIS_DIR}
      version: analysis snapshot for WeKnora commit 18d7a6b
      notes: Read-only product and SDD reference. Do not copy source code, UI assets, prompts, project structure, or implementation details.
    - type: local-file
      ref: docs/00-context/next-phase-plan.zh-CN.md
      version: untracked local draft as of 2026-07-05
      notes: Optional context only. Do not modify or treat as the sole source of truth unless the user asks.
  documents:
    - path: README.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
    - path: PROJECT_RULES.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
    - path: DEVELOPMENT_STANDARDS.md
      required: true
      version: 16ee1d58fb30d701e1f6a6ddf30d3c345913e442
