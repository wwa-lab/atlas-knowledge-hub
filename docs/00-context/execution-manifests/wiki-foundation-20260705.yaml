  optional_code_artifacts:
    - backend Flyway migration for Wiki data model additions
    - backend domain/repository/DTO/mapper/service/controller updates
    - backend API contract tests for Wiki metadata, folder, log, and issue read paths
    - frontend API client/type updates
    - frontend Wiki tab metadata rendering updates
    - frontend unit and Playwright regression coverage
  completion_report:
    include_changed_files: true
    include_sdd_skill_chain: true
    include_skill_files_read: true
    include_verification: true
    include_risks: true
    include_maturity_statement: true

verification:
  commands:
    - command: cd backend && mvn verify
      required: true
    - command: cd frontend && npm run typecheck && npm run test && npm run build
      required: true
    - command: cd frontend && npm run e2e
      required: true
    - command: npm run e2e:second-layer
      required: true
    - command: git diff --check
      required: true
    - command: focused secret/private-path scan over changed files
      required: true
    - command: focused network/dependency scan over changed files
      required: true
  quality_gates:
    - goal_scope_clear
    - sdd_skill_chain_used_and_reported
    - sdd_bilingual_docs_synced
    - requirement_story_task_traceability
    - implementation_matches_spec
    - existing_api_backed_wiki_flow_not_regressed
    - adapter_boundaries_preserved
    - source_trace_confidence_review_status_preserved
    - no_real_data_or_secrets
    - no_external_cloud_calls
    - readiness_language_matches_evidence

stop_conditions:
  - required input document missing
  - required project-local SDD skill file missing or unavailable
  - agent is about to generate a full SDD set without using .agents/skills/atlas-sdd-generate-all/SKILL.md and the required skill chain
  - SDD scope conflicts with current ROADMAP or PROJECT_RULES
  - user has not accepted SDD and the agent is about to edit product code
  - implementation would require production auth/RBAC redesign before the wiki-data-model slice
  - implementation would require real company documents or credentials
  - implementation would require external provider calls outside approved opt-in third-layer testing
  - Flyway migration would break existing mock/sample seed data or existing E2E without an accepted migration plan
  - WeKnora reference material tempts copying implementation details instead of extracting Atlas-specific product intent
