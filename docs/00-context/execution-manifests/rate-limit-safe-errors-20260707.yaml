inputs:
  documents:
    - path: README.md
      required: true
    - path: AGENTS.md
      required: true
    - path: PROJECT_RULES.md
      required: true
    - path: DEVELOPMENT_STANDARDS.md
      required: true
    - path: docs/SDD-BOOTSTRAP.md
      required: true
    - path: docs/SDD-BOOTSTRAP.zh-CN.md
      required: true
    - path: docs/00-context/sdd-profile.md
      required: true
    - path: docs/00-context/agent-goal-loop-workflow.md
      required: true
    - path: docs/00-context/agent-goal-loop-workflow.zh-CN.md
      required: true
  skill_files:
    - path: .agents/skills/atlas-sdd-generate-all/SKILL.md
      required: true
    - path: .agents/skills/req-to-user-story/SKILL.md
      required: true
    - path: .agents/skills/user-story-to-spec/SKILL.md
      required: true
    - path: .agents/skills/spec-to-architecture/SKILL.md
      required: true
    - path: .agents/skills/architecture-to-design/SKILL.md
      required: true
    - path: .agents/skills/design-to-tasks/SKILL.md
      required: true
    - path: .agents/skills/review-doc-quality/SKILL.md
      required: true
    - path: .agents/skills/architecture-review/SKILL.md
      required: false
      required_when: "Slice materially changes architecture, adapter boundaries, API contracts, persistence, security, or data flow."

constraints:
  allowed_paths:
    - docs/00-context/
    - docs/01-requirements/
    - docs/02-user-stories/
    - docs/03-spec/
    - docs/04-architecture/
    - docs/05-design/
    - docs/06-tasks/
    - backend/src/main/java/com/atlas/metadata/
    - backend/src/main/resources/db/migration/
    - backend/src/test/java/com/atlas/metadata/
    - frontend/src/
    - frontend/tests/e2e/
  forbidden_paths:
    - .env
    - .claude/settings.local.json
    - frontend/node_modules/
    - backend/target/
    - frontend/dist/
    - frontend/playwright-report/
    - frontend/test-results/
    - samples/output/
    - tmp/
  external_actions_require_approval: true
  no_external_cloud_calls: true
  no_real_company_data: true
  no_raw_secrets: true
  no_private_paths: true
  adapter_boundaries_required:
    - parser
    - converter
    - model
    - vector
    - storage
    - search

sdd_generation_policy:
  must_use_project_local_skill_chain: true
  entry_skill: .agents/skills/atlas-sdd-generate-all/SKILL.md
  chain:
    - atlas-sdd-generate-all
    - req-to-user-story
    - user-story-to-spec
    - spec-to-architecture
    - architecture-to-design
    - design-to-tasks
    - review-doc-quality
  architecture_review_required_when_material_architecture_or_api_changes: true
  do_not_hand_write_all_sdd_docs_in_one_pass: true
  block_if_skill_chain_unavailable_or_unused: true

outputs:
  expected_artifact_patterns:
    - path: docs/01-requirements/{slice}-requirements.md
      kind: markdown
    - path: docs/01-requirements/{slice}-requirements.zh-CN.md
      kind: markdown
    - path: docs/02-user-stories/{slice}-stories.md
      kind: markdown
    - path: docs/02-user-stories/{slice}-stories.zh-CN.md
      kind: markdown
    - path: docs/03-spec/{slice}-spec.md
      kind: markdown
    - path: docs/03-spec/{slice}-spec.zh-CN.md
      kind: markdown
    - path: docs/04-architecture/{slice}-architecture.md
      kind: markdown
    - path: docs/04-architecture/{slice}-architecture.zh-CN.md
      kind: markdown
    - path: docs/04-architecture/{slice}-data-flow.md
      kind: markdown
    - path: docs/04-architecture/{slice}-data-flow.zh-CN.md
      kind: markdown
    - path: docs/04-architecture/{slice}-data-model.md
      kind: markdown
    - path: docs/04-architecture/{slice}-data-model.zh-CN.md
      kind: markdown
    - path: docs/05-design/{slice}-design.md
      kind: markdown
    - path: docs/05-design/{slice}-design.zh-CN.md
      kind: markdown
    - path: docs/05-design/contracts/{slice}-API_IMPLEMENTATION_GUIDE.md
      kind: markdown
      required_when: "Backend, API, persistence, adapter, or integration behavior is in scope."
    - path: docs/05-design/contracts/{slice}-API_IMPLEMENTATION_GUIDE.zh-CN.md
      kind: markdown
      required_when: "Backend, API, persistence, adapter, or integration behavior is in scope."
    - path: docs/06-tasks/{slice}-tasks.md
      kind: markdown
    - path: docs/06-tasks/{slice}-tasks.zh-CN.md
      kind: markdown
    - path: docs/00-context/{slice}-traceability.md
      kind: markdown
    - path: docs/00-context/{slice}-traceability.zh-CN.md
      kind: markdown
  completion_report:
    include_goal_mode: true
    include_sdd_skill_chain: true
    include_skill_files_read: true
    include_changed_files: true
    include_verification: true
    include_skipped_checks: true
    include_risks: true
    include_maturity_statement: true
    include_next_action: true
    include_resume_point: true

verification:
  commands:
    - command: git diff --check
      required: true
    - command: focused secret/private-path/real-data scan over changed files
      required: true
    - command: focused network/dependency scan over changed files
      required: true
    - command: cd frontend && npm run typecheck && npm run test && npm run build
      required_when: "Frontend files changed."
    - command: cd frontend && npm run e2e
      required_when: "Critical user flow or product surface changed."
    - command: cd backend && mvn verify
      required_when: "Backend, API, database, adapter, or persistence files changed."
    - command: npm run e2e:second-layer
      required_when: "Full-stack API-backed knowledge loop changed."
  quality_gates:
    - goal_scope_clear
    - context_docs_read
    - sdd_skill_chain_used_and_reported
    - sdd_bilingual_docs_synced
    - requirement_story_spec_task_traceability
    - user_acceptance_obtained_when_required
    - implementation_matches_spec
    - adapter_boundaries_preserved
    - source_trace_confidence_review_status_preserved
    - no_real_data_or_secrets
    - no_external_cloud_calls
    - verification_evidence_reported
    - lessons_recorded_when_reusable

loop_policy:
  workflow_tier: "TBD"
  master_goal:
    execute_one_slice_at_a_time: true
    update_status_after_each_slice: true
    recommend_next_slice: true
  single_slice_goal:
    run_sdd_gate_before_code: true
    run_implementation_gate_before_verification: true
    update_traceability_before_closeout: true
  retry_budget:
    formatting_type_unit_contract_failures: 2
    e2e_failures: 1
    security_real_data_secret_external_provider_failures: 0

stop_conditions:
  - required input document missing
  - required project-local SDD skill file missing or unavailable
  - agent is about to generate full SDD without the project-local skill chain
  - user acceptance is required but not yet given
  - implementation would expand beyond the active slice
  - implementation would require real company documents or credentials
  - implementation would require unapproved external provider calls
  - verification retry budget exhausted
  - existing user or other-agent changes would be overwritten
